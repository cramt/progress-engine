# Archive whatever Delver X build https://mtg.delver.app serves, once a day, as
# a tag of the public OCI artifact ghcr.io/cramt/delver-x. Upstream serves only
# its current build, so a build not saved the day it ships is gone. See
# crates/gitaxian-probe/archive/README.md.
#
# GITHUB_TOKEN is enough: it pushes to this repo's owner, and the artifact's
# source annotation links the package here.
name: Probe archive

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: probe-archive

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oras-project/setup-oras@v1
      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Fetch what Delver serves
        run: python3 crates/gitaxian-probe/archive/archive.py fetch "$RUNNER_TEMP/build"
      - name: Keep it, if it is new
        run: python3 crates/gitaxian-probe/archive/archive.py publish "$RUNNER_TEMP/build"
