# Propose pinning each new Delver X build the archive holds (the OCI artifact
# ghcr.io/cramt/delver-x, which probe-archive.yml publishes). One PR per build,
# ever: a PR closed without merging is an answer.
#
# The archive is public and read anonymously, and GITHUB_TOKEN pushes the
# branch and opens the PR. Events GITHUB_TOKEN causes start no workflows, so
# the PR alone would never be checked; a dispatch is the exception, so this
# starts CI and the probe web check on the branch itself, and their results
# land on the PR's head commit. Opening the PR needs Settings > Actions >
# General > "Allow GitHub Actions to create and approve pull requests".
name: Probe pin

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency: probe-pin

jobs:
  pin:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oras-project/setup-oras@v1
      - name: Pin the archive's newest build
        run: |
          pin=crates/gitaxian-probe/assets/pin.json
          oras manifest fetch ghcr.io/cramt/delver-x:latest > "$RUNNER_TEMP/manifest.json" \
            || { echo "the archive has no latest tag yet"; exit 0; }
          changed=$(python3 crates/gitaxian-probe/assets/repin.py "$RUNNER_TEMP/manifest.json")
          [ "$changed" = "changed=true" ] || { echo "latest is already pinned"; exit 0; }
          latest=$(jq -r .tag "$pin")
          branch="delver/$latest"
          if [ -n "$(gh pr list --head "$branch" --state all --json number --jq '.[].number')" ]; then
            echo "$latest has had its PR"
            exit 0
          fi
          version=$(jq -r .version "$pin")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "probe: pin delver x $version, archived as $latest"
          git push origin "$branch"
          gh pr create --head "$branch" \
            --title "probe: pin delver x $version, archived as $latest" \
            --body "The archive holds Delver X $version as \`ghcr.io/cramt/delver-x:$latest\`, and this PR pins it.

          CI and the probe web check were started on this branch by the pin workflow, since a PR it opens starts none. The web check says whether \`KNOWN_FINGERPRINT\` still holds and whether card name (6/6) and exact printing (4/6) moved. A moved fingerprint or number needs a person's reading of FINDINGS.md before this merges. CI does not run the native accuracy test (\`PROBE_REQUIRE_ENGINE=1\`)."
          gh workflow run ci.yml --ref "$branch"
          gh workflow run probe-web-check.yml --ref "$branch"
