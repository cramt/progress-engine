# Gitaxian Probe's web host in headless Chromium, held to the native accuracy
# numbers (crates/gitaxian-probe/web-check/run.sh). The probe is outside the
# flake (ADR-0015), so `nix flake check` never runs this.
#
# The engine files come from the public archive (ghcr.io/cramt/delver-x), so a
# pin keeps building after Delver has moved on.
name: Probe web check

on:
  pull_request:
    paths:
      - "crates/gitaxian-probe/**"
      - ".github/workflows/probe-web-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gitaxian-probe
      - name: ImageMagick, for the fixture frames
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: The wasm-bindgen CLI the probe's Cargo.lock names
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' crates/gitaxian-probe/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$v" --locked
      - name: Playwright and its Chromium
        run: npm install -g playwright && npx playwright install --with-deps chromium
      - name: Fixture frames
        run: crates/gitaxian-probe/engine/.fixtures/fetch-cards.sh
      - name: Web check
        run: NODE_PATH="$(npm root -g)" crates/gitaxian-probe/web-check/run.sh
