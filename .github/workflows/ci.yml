name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Probe pin starts it on the PRs it opens, which start no workflows themselves.
  workflow_dispatch:

permissions:
  contents: read
  # hestia lists the cache to find what earlier jobs pushed; without it the
  # job still pushes but substitutes nothing
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # The beta fork, ahead of github.com/Mic92/hestia's v3. Move to
      # Mic92/hestia once it releases a v4.
      - uses: Mic92/hestia-beta@v4.0.0-beta.2
        with:
          version: v4.0.0-beta.2
      - run: nix flake check -L

  # Only the worker and site, as `nix run .#deploy-curator` ships them. The
  # domain and the client secret stay with `nix run .#infra -- apply`, whose
  # state is on luna's LAN and out of a runner's reach; the secret survives a
  # deploy that doesn't upload it.
  deploy-curator:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The group only keeps two deploys from overlapping. An older run whose
    # check finishes after a newer run has deployed would still deploy next
    # and roll the site back, so a deploy ships only while its commit is
    # main's tip.
    concurrency:
      group: deploy-curator
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on to $tip; not deploying $GITHUB_SHA over it"
          fi
      - if: steps.tip.outputs.latest == 'true'
        uses: DeterminateSystems/nix-installer-action@main
      - if: steps.tip.outputs.latest == 'true'
        uses: Mic92/hestia-beta@v4.0.0-beta.2
        with:
          version: v4.0.0-beta.2
      - if: steps.tip.outputs.latest == 'true'
        run: nix run -L .#deploy-curator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
