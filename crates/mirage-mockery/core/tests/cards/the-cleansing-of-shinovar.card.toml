name = "The Cleansing of Shinovar"
cost = "{2}{R}{W}"
type = "Enchantment — Saga"
rules = """
(As this Saga enters and after your draw step, add a lore counter.)
I — Search your library for an Equipment card, reveal it, put it into your hand, then shuffle.
II, III — Target creature you control fights up to one target creature you don't control. If that creature would die this turn, exile it instead.
IV — Exile this Saga, then return it to the battlefield transformed under your control.
"""
flavor = "Ten monasteries, ten Honorblades, and one stubborn Windrunner with a pot of stew."
artist = "Mirage Mockery"
