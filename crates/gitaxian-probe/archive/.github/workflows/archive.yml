# Archive whatever Delver X build https://mtg.delver.app serves, once a day.
# Upstream serves only its current build, so a build not saved the day it
# ships is gone. See README.md.
#
# This repo's own GITHUB_TOKEN is enough: it only makes releases here.
name: Archive

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: archive

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch what Delver serves
        run: python3 archive.py fetch build
      - name: Keep it, if it is new
        run: python3 archive.py publish build
