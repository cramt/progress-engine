[package]
name = "gitaxian-probe-engine"
description = "Sandboxed host for the Delver X card-recognition engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "gitaxian_probe_engine"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
deno_core.workspace = true
deno_error.workspace = true
facet.workspace = true
facet-json.workspace = true
facet-msgpack.workspace = true
facet-value.workspace = true
gitaxian-probe-proto.workspace = true
sevenz-rust2.workspace = true
sha2.workspace = true
tokio.workspace = true
ureq.workspace = true

# Shipped inside the Android APK as `lib*.so` and exec'd from
# nativeLibraryDir, because V8 needs a process of its own there.
[[bin]]
name = "probe-host"
path = "src/bin/probe-host.rs"

[[example]]
name = "query"
path = "examples/query.rs"

[[example]]
name = "recognize"
path = "examples/recognize.rs"

# Compiles src/tls_align.c, but only for aarch64-linux-android.
[build-dependencies]
cc = "1"
