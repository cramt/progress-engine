[package]
name = "gitaxian-probe-engine"
description = "Sandboxed host for the Delver X card-recognition engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "gitaxian_probe_engine"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
facet.workspace = true
facet-json.workspace = true
facet-msgpack.workspace = true
facet-value.workspace = true
sha2.workspace = true
# Both hosts unpack the model; the web one in the page.
sevenz-rust2.workspace = true

# Native: the engine inside deno_core, downloading its own files.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
deno_core.workspace = true
deno_error.workspace = true
tokio.workspace = true
ureq.workspace = true

# Web: the engine as a sidecar in the page, from files the page serves.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[[example]]
name = "query"
path = "examples/query.rs"

[[example]]
name = "recognize"
path = "examples/recognize.rs"
