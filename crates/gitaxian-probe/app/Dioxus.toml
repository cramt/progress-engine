[application]
# Matches the API level the NDK toolchain in flake.nix links against. 28 is
# V8's floor: its bundled libc++ calls aligned_alloc, which bionic only has
# from 28.
android_min_sdk_version = 28

# dx maps these onto <uses-permission> for Android and plist keys for Apple
# platforms, so the manifest stays generated rather than hand-edited.
[permissions]
camera = { description = "Scan cards with the camera" }

# INTERNET has no entry in dx's unified permission list - that list covers the
# ones a user is prompted for, and INTERNET is install-time on Android. It goes
# through the raw escape hatch instead. The engine downloads its model and card
# database on first run.
[android.permissions]
"android.permission.INTERNET" = { description = "Download the card recognition engine" }

# facet's tagged pointer claims bit 63 of a pointer as its "this is a wide
# pointer" flag, on the stated assumption that user-space addresses never set
# it. Android arm64 breaks that assumption: it tags heap pointers in the top
# byte (Top-Byte-Ignore), and when a tag sets bit 63 facet reads an ordinary
# thin pointer as wide and panics in `as_mut_byte_ptr`.
#
# It is allocation-dependent, so it surfaces at a different point on every run
# - including inside the engine's own msgpack job decode, which is not code we
# can route around. x86_64 has no TBI, which is why an emulator never sees it.
#
# Turning tagging off is Android's documented opt-out, and it is inherited
# across the exec into the engine host process. Remove once facet tags a low
# alignment bit instead of bit 63.
# https://github.com/facet-rs/facet/issues/2659
[android.raw]
application_attrs = 'android:allowNativeHeapPointerTagging="false"'
