[package]
name = "gitaxian-probe-app"
description = "Dioxus Native shell for Gitaxian Probe - hello world, for now"
version.workspace = true
# Not the workspace's 2021: blitz-dom is edition 2024 and stylo's build scripts
# want a toolchain new enough for it.
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

# Android loads the app as a shared library through NativeActivity; the binary
# target is the same app on the desktop, so both entry points stay in sync.
[lib]
name = "gitaxian_probe_app"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gitaxian-probe-app"
path = "src/main.rs"

[features]
default = ["skia"]

# Pick exactly one renderer. On Android only skia is usable today: vello paints a
# black screen and vello-hybrid stutters badly.
# https://github.com/DioxusLabs/blitz/issues/377
skia = ["dioxus-native/skia"]
vello = ["dioxus-native/vello"]
vello-hybrid = ["dioxus-native/vello-hybrid"]

[dependencies]
dioxus-native.workspace = true
idna_adapter.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-activity.workspace = true
