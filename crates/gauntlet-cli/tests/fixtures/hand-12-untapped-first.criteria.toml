# HANDS.md hand 12, mana first: play the untapped land, and cast Lantern of
# Insight on turn 1 at the price of surveilling a turn later.
#
# The pair with hand-12-surveil-first.criteria.toml: same deck, same questions,
# same effect, and the only difference is the order of two lands.
[land_drop]
prefer = ["t:land -otag:tapland"]

[[effect]]
match = "t:land otag:surveil"
look = 1
on = "landdrop"
to_graveyard = 'name:"Lightning Bolt"'

[[criterion]]
name = "Lantern castable on turn 1"
require = [
  { turn = 1, query = 'name:"Lantern of Insight"', min = 1 },
  { turn = 1, can_cast = "{1}" },
]

[[criterion]]
name = "Lantern castable on turn 2"
require = [
  { turn = 2, query = 'name:"Lantern of Insight"', min = 1 },
  { turn = 2, can_cast = "{1}" },
]

[[criterion]]
name = "a Bolt binned by turn 2"
require = [
  { turn = 2, query = 'name:"Lightning Bolt"', zone = "graveyard", min = 1 },
]
