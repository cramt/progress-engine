# HANDS.md hand 9: play Undercity Sewers, surveil 1, and the Loam on top is
# binned. Loam is in the graveyard on turn 1.
#
# The routing is declared here rather than in the standard library because it is
# part of the question. `loam-hand.criteria.toml` is this same deck and this same
# card with the opposite routing, and neither of them is a property of Undercity
# Sewers.
[[effect]]
match = "t:land otag:surveil"
look = 1
on = "landdrop"
to_graveyard = 'name:"Life from the Loam"'

[[criterion]]
name = "loam in the yard by turn 5"
require = [
  { turn = 5, query = 'name:"Life from the Loam"', zone = "graveyard", min = 1 },
]

# The other side of the same routing. A Loam that went to the yard is not in
# hand, so this is strictly lower than the same clause in loam-hand.criteria.toml
# -- which is what makes it a clause whose answer moves with the feature rather
# than one that reads zero either way.
[[criterion]]
name = "loam in hand by turn 5"
require = [
  { turn = 5, query = 'name:"Life from the Loam"', zone = "hand", min = 1 },
]

[[expect]]
name = "loam binned by turn 5"
turn = 5
query = 'name:"Life from the Loam"'
zone = "graveyard"
