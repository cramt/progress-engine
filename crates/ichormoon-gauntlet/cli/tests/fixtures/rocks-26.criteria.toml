# HANDS.md hand 26: Island, Sol Ring, Lantern of Insight. Sol Ring is not a
# creature, so it taps the turn it is cast, and its mana pays for the Lantern
# the line casts after it. One {C} is left over.

[casting]
prefer = ['name:"Sol Ring"', 'name:"Lantern of Insight"']

[[criterion]]
name = "Lantern cast on turn 1"
require = [{ turn = 1, cast = 'name:"Lantern of Insight"', min = 1 }]

[[criterion]]
name = "Sol Ring cast on turn 1"
require = [{ turn = 1, cast = 'name:"Sol Ring"', min = 1 }]

[[criterion]]
name = "{1} left on turn 1"
require = [{ turn = 1, can_cast = "{1}" }]
