# An objective weighing a question the exact engine cannot enumerate. It is
# refused by name rather than optimised over a sample: a strategy chosen from
# sampled conditionals keeps the openers that were lucky in the sample.
[mulligan]
optimise = { "everything at once by turn 6, off a turn-2 land" = 1 }
down_to = 5

[[criterion]]
name = "everything at once by turn 6, off a turn-2 land"
at_least = 0.10
require = [
  { turn = 2, query = "t:land", min = 1 },
  { turn = 6, query = "t:land", min = 3 },
  { turn = 6, query = 'cat:"Ramp"', min = 1 },
  { turn = 6, query = 'cat:"Ramp - One Mana"', min = 1 },
  { turn = 6, query = 'cat:"Draw"', min = 1 },
  { turn = 6, query = 'cat:"Ramp - Engine"', min = 0 },
  { turn = 6, query = "t:creature", min = 1 },
  { turn = 6, query = "t:instant", min = 0 },
]

# Informational, and deliberately nowhere near its own error bar: a sampled
# answer still has to report the questions that are not close calls as ordinary
# answers. This one reads one query at one turn, so it is enumerated exactly
# beside the estimate above.
[[criterion]]
name = "a land by turn 6"
require = [{ turn = 6, query = "t:land", min = 1 }]

[[expect]]
name = "lands by turn 6"
turn = 6
query = "t:land"
