# HANDS.md hand 36: Spellseeker tutors Life from the Loam, and the Loam the
# line then casts resolves into the graveyard.
#
# Loam first: a Loam already in hand is cast the first turn {1}{G} is there,
# and Spellseeker is cast with what is left. The other order would spend turn
# 3's three mana on a Spellseeker with nothing left to find and hold the Loam
# a turn.

[[effect]]
match = 'name:"Spellseeker"'
on = "cast"
fetch = ['name:"Life from the Loam"']
to = "hand"

[casting]
prefer = ['name:"Life from the Loam"', 'name:"Spellseeker"']

[[criterion]]
name = "Spellseeker cast by turn 3"
require = [{ turn = 3, cast = 'name:"Spellseeker"', min = 1 }]

[[criterion]]
name = "Loam in the graveyard by turn 4"
require = [{ turn = 4, query = 'name:"Life from the Loam"', zone = "graveyard", min = 1 }]

[[criterion]]
name = "Loam still in the library on turn 4"
require = [{ turn = 4, query = 'name:"Life from the Loam"', zone = "library", min = 1 }]

[[criterion]]
name = "Loam in the graveyard by turn 5"
require = [{ turn = 5, query = 'name:"Life from the Loam"', zone = "graveyard", min = 1 }]
