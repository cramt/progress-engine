# Wrenn and Seven's +1, from the standard library: nobody chooses, so the
# file declares only the line.

[casting]
prefer = ['name:"Wrenn and Seven"']

[[criterion]]
name = "Wrenn and Seven cast by turn 5"
require = [{ turn = 5, cast = 'name:"Wrenn and Seven"', min = 1 }]

[[criterion]]
name = "Loam in the graveyard by turn 5"
require = [{ turn = 5, query = 'name:"Life from the Loam"', zone = "graveyard", min = 1 }]

[[criterion]]
name = "eight lands in hand by turn 5"
require = [{ turn = 5, query = "t:land", min = 8 }]
