# An activation on a land: refused by name, because a land's ability is paid
# out of the drop the line reads, and the one the Lantern deck plays,
# Inventors' Fair, counts artifacts in play, which nothing reads (ADR-0019).
[[effect]]
match = "name:\"Urza's Saga\""
on = "activate"
cost = "{2}"
sacrifice = true
fetch = ['name:"Lantern of Insight"']
to = "hand"

[casting]
prefer = ['name:"Expedition Map"']

[[criterion]]
name = "Lantern in hand by turn 5"
require = [{ turn = 5, query = 'name:"Lantern of Insight"', min = 1 }]
