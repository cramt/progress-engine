# HANDS.md hand 43: a permanent held in hand is not on the battlefield.
#
# The same file runs against both decklists. Hand 43 casts the Lantern the
# turn it has an Island for it; the no-lands column holds it and never can.
# No `[land_drop]`, deliberately: a run that does not say which land it played
# still knows that a Lantern gets onto the battlefield by being cast.

[casting]
prefer = ['name:"Lantern of Insight"']

[[criterion]]
name = "Lantern cast by turn 1"
require = [{ turn = 1, cast = 'name:"Lantern of Insight"', min = 1 }]

[[criterion]]
name = "Lantern on the battlefield on turn 1"
require = [{ turn = 1, query = 'name:"Lantern of Insight"', zone = "battlefield", min = 1 }]

[[criterion]]
name = "Lantern in hand on turn 1"
require = [{ turn = 1, query = 'name:"Lantern of Insight"', min = 1 }]

[[criterion]]
name = "Lantern on the battlefield by turn 3"
require = [{ turn = 3, query = 'name:"Lantern of Insight"', zone = "battlefield", min = 1 }]
