# Route B without the fetch: the deck draws both halves or it does not.
#
# The pair with `tutor-on.criteria.toml`, which is this file with an
# `[[effect]]` block on top and nothing else different. Two numbers must move
# and one must not.
[casting]
prefer = ['name:"Trinket Mage"', 'name:"Lantern of Insight"']

[[criterion]]
name = "Trinket Mage cast by turn 4"
require = [{ turn = 4, cast = 'name:"Trinket Mage"', min = 1 }]

[[criterion]]
name = "Trinket Mage and a Lantern both cast by turn 4"
require = [
  { turn = 4, cast = 'name:"Trinket Mage"', min = 1 },
  { turn = 4, cast = 'name:"Lantern of Insight"', min = 1 },
]

[[criterion]]
name = "Lantern of Insight still in the library on turn 4"
require = [{ turn = 4, query = 'name:"Lantern of Insight"', zone = "library", min = 1 }]
