# HANDS.md hand 37: the commander is cast from the command zone.
#
# The same file runs against three decklists: twelve lands of the three colours
# the commander needs, three lands and nine spells, and twelve Forests. The
# commander starts in the command zone, so it is always available and never
# drawn, and the line below is the only thing that spends mana on it.

[casting]
prefer = ['name:"Rashmi and Ragavan"']

[[criterion]]
name = "commander cast by turn 3"
require = [{ turn = 3, cast = 'name:"Rashmi and Ragavan"', min = 1 }]

[[criterion]]
name = "commander cast by turn 4"
require = [{ turn = 4, cast = 'name:"Rashmi and Ragavan"', min = 1 }]

# Once is enough: it leaves the command zone when it is cast, and nothing here
# puts it back.
[[criterion]]
name = "commander cast twice by turn 5"
require = [{ turn = 5, cast = 'name:"Rashmi and Ragavan"', min = 2 }]

# A creature, so the casting puts it onto the battlefield.
[[criterion]]
name = "commander on the battlefield by turn 4"
require = [{ turn = 4, query = 'name:"Rashmi and Ragavan"', zone = "battlefield", min = 1 }]

# Never drawn, so never in hand.
[[criterion]]
name = "commander in hand by turn 5"
require = [{ turn = 5, query = 'name:"Rashmi and Ragavan"', min = 1 }]

# One pool: the gate asks what the line left. Turn 4's four lands all went on
# the commander; turn 5's five are untouched, because it was already cast.
[[criterion]]
name = "a red mana left on turn 4"
require = [{ turn = 4, can_cast = "{R}" }]

[[criterion]]
name = "a red mana left on turn 5"
require = [{ turn = 5, can_cast = "{R}" }]

[[criterion]]
name = "four lands in play by turn 4"
require = [{ turn = 4, query = "t:land", zone = "battlefield", min = 4 }]
