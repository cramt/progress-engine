# Issue #138, on traumatize.txt. The line casts Traumatize and nothing else,
# aimed at its own library, so a Cid is in the graveyard only where the mill
# put it there.

[[effect]]
match = 'name:"Traumatize"'
on = "cast"
mill = "half"

[casting]
prefer = ['name:"Traumatize"']

[[criterion]]
name = "a Cid in the graveyard by turn 5"
require = [{ turn = 5, query = 'name:"Cid, Timeless Artificer"', zone = "graveyard", min = 1 }]

[[expect]]
name = "Cids in the graveyard on turn 5"
turn = 5
query = 'name:"Cid, Timeless Artificer"'
zone = "graveyard"

[[expect]]
name = "Cids in the library on turn 5"
turn = 5
query = 'name:"Cid, Timeless Artificer"'
zone = "library"
