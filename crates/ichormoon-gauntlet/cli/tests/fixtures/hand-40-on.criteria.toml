# HANDS.md hand 40, the "fetch to battlefield" column: Tezzeret the Seeker
# enters with four loyalty and -1 puts an artifact of mana value 1 or less
# onto the battlefield, at sorcery speed, the turn he is cast. The line reads
# the Lantern first, so a Lantern already in hand is cast for {1}.
#
# hand-40-off.criteria.toml is the same file without the effect.

[[effect]]
match = 'name:"Tezzeret the Seeker"'
on = "cast"
fetch = ['name:"Lantern of Insight"']
to = "battlefield"

[casting]
prefer = ['name:"Lantern of Insight"', 'name:"Tezzeret the Seeker"']

[[criterion]]
name = "Tezzeret the Seeker cast by turn 5"
require = [{ turn = 5, cast = 'name:"Tezzeret the Seeker"', min = 1 }]

[[criterion]]
name = "Lantern on the battlefield by turn 5"
require = [{ turn = 5, query = 'name:"Lantern of Insight"', zone = "battlefield", min = 1 }]

[[criterion]]
name = "Lantern cast by turn 5"
require = [{ turn = 5, cast = 'name:"Lantern of Insight"', min = 1 }]

[[criterion]]
name = "Lantern still in the library on turn 5"
require = [{ turn = 5, query = 'name:"Lantern of Insight"', zone = "library", min = 1 }]
