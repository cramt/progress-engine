# The Lantern asked of a deck whose every land surveils, beside the same deck
# of Islands. The surveil bins whatever is not the Lantern and keeps the
# Lantern on top, so each land drop digs one card deeper; every surveil land
# also enters tapped, so nothing is cast on turn 1.
[[effect]]
match = "t:land otag:surveil"
look = 1
on = "landdrop"
to_graveyard = '-name:"Lantern of Insight"'

[land_drop]
prefer = ["t:land"]

[casting]
prefer = ['name:"Lantern of Insight"']

[[criterion]]
name = "Lantern in play by turn 1"
require = [{ turn = 1, query = 'name:"Lantern of Insight"', zone = "battlefield", min = 1 }]

[[criterion]]
name = "Lantern in play by turn 2"
require = [{ turn = 2, query = 'name:"Lantern of Insight"', zone = "battlefield", min = 1 }]

[[criterion]]
name = "Lantern in play by turn 5"
require = [{ turn = 5, query = 'name:"Lantern of Insight"', zone = "battlefield", min = 1 }]

[[criterion]]
name = "Lantern in the graveyard by turn 5"
require = [{ turn = 5, query = 'name:"Lantern of Insight"', zone = "graveyard", min = 1 }]

[[expect]]
name = "lands binned by turn 5"
turn = 5
query = "t:land"
zone = "graveyard"
