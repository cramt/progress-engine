# HANDS.md hand 26, the line reversed: the Lantern takes the Island, and Sol
# Ring cannot be paid for until turn 2. The order is the pilot's to declare.

[casting]
prefer = ['name:"Lantern of Insight"', 'name:"Sol Ring"']

[[criterion]]
name = "Lantern cast on turn 1"
require = [{ turn = 1, cast = 'name:"Lantern of Insight"', min = 1 }]

[[criterion]]
name = "Sol Ring cast on turn 1"
require = [{ turn = 1, cast = 'name:"Sol Ring"', min = 1 }]

[[criterion]]
name = "{1} left on turn 1"
require = [{ turn = 1, can_cast = "{1}" }]
