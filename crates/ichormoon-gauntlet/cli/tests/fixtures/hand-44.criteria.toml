# HANDS.md hand 44: hand 40 with the Lantern taken out of the line, so the
# only way it reaches the battlefield is Tezzeret the Seeker putting it there.
# The battlefield question about it is answered for that reason alone, as a
# Saga's chapter opens it.

[[effect]]
match = 'name:"Tezzeret the Seeker"'
on = "cast"
fetch = ['name:"Lantern of Insight"']
to = "battlefield"

[casting]
prefer = ['name:"Tezzeret the Seeker"']

[[criterion]]
name = "Tezzeret the Seeker cast by turn 5"
require = [{ turn = 5, cast = 'name:"Tezzeret the Seeker"', min = 1 }]

[[criterion]]
name = "Lantern on the battlefield on turn 4"
require = [{ turn = 4, query = 'name:"Lantern of Insight"', zone = "battlefield", min = 1 }]

[[criterion]]
name = "Lantern on the battlefield on turn 5"
require = [{ turn = 5, query = 'name:"Lantern of Insight"', zone = "battlefield", min = 1 }]

[[criterion]]
name = "Lantern still in the library on turn 5"
require = [{ turn = 5, query = 'name:"Lantern of Insight"', zone = "library", min = 1 }]

[[criterion]]
name = "Lantern in hand on turn 5"
require = [{ turn = 5, query = 'name:"Lantern of Insight"', min = 1 }]
