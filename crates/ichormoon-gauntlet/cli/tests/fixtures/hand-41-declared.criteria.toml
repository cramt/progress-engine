# HANDS.md hand 41, the "declared {1}{U}{U}" column. Dizzy Spell's transmute
# is {1}{U}{U} and discard it, at sorcery speed, and finds a card of its own
# mana value, 1: the Lantern, to hand. The line bills the declared cost in
# place of the printed {U}, and a `cast` clause counts the transmutation as
# Dizzy Spell played.
#
# hand-41-printed.criteria.toml is the same file without `cost`.

[[effect]]
match = 'name:"Dizzy Spell"'
on = "cast"
cost = "{1}{U}{U}"
fetch = ['name:"Lantern of Insight"']
to = "hand"

[casting]
prefer = ['name:"Lantern of Insight"', 'name:"Dizzy Spell"']

[[criterion]]
name = "Dizzy Spell played by turn 2"
require = [{ turn = 2, cast = 'name:"Dizzy Spell"', min = 1 }]

[[criterion]]
name = "Lantern cast by turn 2"
require = [{ turn = 2, cast = 'name:"Lantern of Insight"', min = 1 }]

[[criterion]]
name = "Lantern cast by turn 4"
require = [{ turn = 4, cast = 'name:"Lantern of Insight"', min = 1 }]
