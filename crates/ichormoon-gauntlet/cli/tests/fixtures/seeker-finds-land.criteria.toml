# A cast fetch onto the battlefield whose priority can find a land, with no
# [land_drop]: refused, because a land a spell puts down is counted beside the
# lands played, which only a declared drop names (ADR-0025). The Lantern entry alone is accepted
# (hand-40-on.criteria.toml); the Island behind it is what is refused.

[[effect]]
match = 'name:"Tezzeret the Seeker"'
on = "cast"
fetch = ['name:"Lantern of Insight"', 't:land']
to = "battlefield"

[casting]
prefer = ['name:"Tezzeret the Seeker"']

[[criterion]]
name = "Tezzeret the Seeker cast by turn 5"
require = [{ turn = 5, cast = 'name:"Tezzeret the Seeker"', min = 1 }]
