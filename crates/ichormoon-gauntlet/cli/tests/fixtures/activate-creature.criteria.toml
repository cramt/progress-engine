# An activation on a creature: refused by name, because its {T} would wait
# out summoning sickness and nothing but a dork's mana models that (ADR-0019).
[[effect]]
match = 'name:"Trinket Mage"'
on = "activate"
cost = "{1}"
fetch = ['name:"Lantern of Insight"']
to = "hand"

[casting]
prefer = ['name:"Trinket Mage"']

[[criterion]]
name = "Lantern in hand by turn 5"
require = [{ turn = 5, query = 'name:"Lantern of Insight"', min = 1 }]
