# Issue #139, on tombs.txt. The line casts Out of the Tombs and nothing else.
# The effect is the standard library's.

[casting]
prefer = ['name:"Out of the Tombs"']

[[criterion]]
name = "a Cid in the graveyard by turn 5"
require = [{ turn = 5, query = 'name:"Cid, Timeless Artificer"', zone = "graveyard", min = 1 }]

[[expect]]
name = "Cids in the graveyard on turn 5"
turn = 5
query = 'name:"Cid, Timeless Artificer"'
zone = "graveyard"
