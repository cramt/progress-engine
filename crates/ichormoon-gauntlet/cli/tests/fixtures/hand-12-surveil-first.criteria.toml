# HANDS.md hand 12, filtering first: play the surveil land while you can, and
# cast Lantern of Insight a turn later than you would have.
#
# The pair with hand-12-untapped-first.criteria.toml. Same deck, same questions,
# same effect — only the priority differs, and it differs by a factor of two on
# turn 1.
[land_drop]
prefer = ["otag:surveil"]

[[effect]]
match = "t:land otag:surveil"
look = 1
on = "landdrop"
to_graveyard = 'name:"Lightning Bolt"'

[[criterion]]
name = "Lantern castable on turn 1"
require = [
  { turn = 1, query = 'name:"Lantern of Insight"', min = 1 },
  { turn = 1, can_cast = "{1}" },
]

[[criterion]]
name = "Lantern castable on turn 2"
require = [
  { turn = 2, query = 'name:"Lantern of Insight"', min = 1 },
  { turn = 2, can_cast = "{1}" },
]

# The filtering half, in the same file as the mana half, which is the whole of
# what this hand was waiting for.
[[criterion]]
name = "a Bolt binned by turn 2"
require = [
  { turn = 2, query = 'name:"Lightning Bolt"', zone = "graveyard", min = 1 },
]
