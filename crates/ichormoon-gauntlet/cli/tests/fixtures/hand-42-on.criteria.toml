# HANDS.md hand 42, the "activation {2}, Saga to hand" column. The [casting]
# entry naming the Map both casts it for its printed {1} and pays {2} to
# activate a copy in play, sacrificing it; the Saga it finds goes to hand.
# Paid after the land drop, except where the land it finds is one the
# [land_drop] list ranks above every land in hand: then before, so the Saga
# is that turn's drop. hand-42-off.criteria.toml is this file without it.

[[effect]]
match = 'name:"Expedition Map"'
on = "activate"
cost = "{2}"
sacrifice = true
fetch = ["name:\"Urza's Saga\""]
to = "hand"

[[effect]]
match = "name:\"Urza's Saga\""
on = "landdrop"
after = 2
sacrifice = true
fetch = ['name:"Lantern of Insight"']
to = "battlefield"

[land_drop]
prefer = ["name:\"Urza's Saga\"", "t:land"]

[casting]
prefer = ['name:"Expedition Map"']

[[criterion]]
name = "Expedition Map cast on turn 1"
require = [{ turn = 1, cast = 'name:"Expedition Map"', min = 1 }]

[[criterion]]
name = "Urza's Saga played by turn 3"

  [[criterion.any_of]]
  require = [{ turn = 1, query = "name:\"Urza's Saga\"", zone = "battlefield", min = 1 }]

  [[criterion.any_of]]
  require = [{ turn = 2, query = "name:\"Urza's Saga\"", zone = "battlefield", min = 1 }]

  [[criterion.any_of]]
  require = [{ turn = 3, query = "name:\"Urza's Saga\"", zone = "battlefield", min = 1 }]

[[criterion]]
name = "Lantern on the battlefield by turn 5"
require = [{ turn = 5, query = 'name:"Lantern of Insight"', zone = "battlefield", min = 1 }]

[[criterion]]
name = "Expedition Map on the battlefield on turn 5"
require = [{ turn = 5, query = 'name:"Expedition Map"', zone = "battlefield", min = 1 }]
