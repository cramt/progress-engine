# HANDS.md hand 23, as a deck. The standard library says the commander draws a
# card as it enters and then may discard any number of land cards; this file
# names the Loam first, which the card may not take, and lands after it.

[land_drop]
prefer = ['t:land']

[casting]
prefer = ['name:"Borborygmos and Fblthp"']

[discard]
prefer = ['name:"Life from the Loam"', 't:land']

[[criterion]]
name = "the commander cast by turn 5"
require = [{ turn = 5, cast = 'name:"Borborygmos and Fblthp"', min = 1 }]

[[criterion]]
name = "Loam in the graveyard on turn 5"
require = [{ turn = 5, query = 'name:"Life from the Loam"', zone = "graveyard", min = 1 }]

[[criterion]]
name = "a land in the graveyard on turn 5"
require = [{ turn = 5, query = "t:land", zone = "graveyard", min = 1 }]

[[criterion]]
name = "Loam in hand on turn 5"
require = [{ turn = 5, query = 'name:"Life from the Loam"', min = 1 }]
