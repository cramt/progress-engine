# The standard effect library.
#
# This ships with the tool and loads before your criteria file. It is not a
# format of its own and not special machinery: these are `[[effect]]` tables in
# exactly the syntax you would write for the one niche card nobody thought of,
# and they load first so that anything you write overrides them. Overlap
# resolves last-wins, per card, so overriding an entry is writing it again.
#
# Two rules decide what may live here, and both of them delete entries rather
# than add them.
#
# **It only says what a card looks at.** Not where the cards go. Those are
# different questions and only one of them is about the card: the same surveil
# land wants Life from the Loam in the graveyard in one deck and on top of the
# library in another, so a destination declared here would be this tool
# answering a question nobody asked it. Write `to_graveyard` in your own file;
# an effect with no destination leaves every card it looks at on top, which is
# where it already was, and therefore moves no number. The one destination this
# file states is one no pilot chooses: a mill puts its cards in the graveyard
# because the card says so (ADR-0017 §2), and which of them you keep instead is
# still yours, as `to_hand`.
#
# **Every entry names its reason**, in the style of the oracle tag list in
# `chip-scryfall/src/tags.rs`. An entry nothing needs can then be deleted rather
# than argued about, and a list of plausible-looking Magic vocabulary cannot
# accumulate here unexamined. `otag:ramp` is not here: ramp does not look at
# cards, and an entry claiming it did would be a number that moved for a reason
# that is not true.
#
# Every entry that looks is `on = "landdrop"`, and that is a fact about what a
# *look* can do rather than about what a trigger can be. A land drop is free and
# capped at one a turn, which is what keeps a look bounded and exact. `on =
# "cast"` fires — the budget knows which spells a turn paid for, and the mana
# sources at the end of this file are cast entries — but what it may do is a
# `fetch` or an `adds` and not a `look`: a fetch names a card and removes it, which is a
# subtraction, and a look turns over a card nobody has seen, which is a
# replacement draw. A replacement draw makes how many cards you have seen by a
# turn a fact about the path rather than about the schedule, which costs an
# enumeration checkpoint a turn and goes over the ceiling on every question this
# tool exists for. See issue #57. A `mill` is the exception that is not a look:
# it turns cards over and takes every one of them off the top at once, so it is
# one block dealt on the paths that cast it (ADR-0017), and the mills at the end
# of this file are cast entries too.
#
# **And a `fetch` will never be declared here.** Trinket Mage finds a mana value
# 1 artifact; *which* one it finds is the question you are asking, exactly as a
# surveil's destination is. So the same rule covers both: this file says what a
# card does and never what you would choose.

# Surveil lands: Undercity Sewers, Hedge Maze, Commercial District and their
# cycle-mates, plus every future printing that joins them.
#
# Because: these are the only land drop in the game whose looked-at card has a
# destination this engine models. Surveil's other destination is the graveyard,
# and the graveyard is a zone a criterion can ask about — which makes this the
# entry the Life from the Loam north star runs on. It surveils on entry whether
# or not the land is tapped, so it needs nothing from the mana model.
[[effect]]
match = "t:land otag:surveil"
look = 1
on = "landdrop"

# Scry lands: the Theros temples and the rest of the cycle.
#
# Because: they look at exactly one card on the same free, capped land drop, so
# what the pilot sees by a given turn is the same as with a surveil land. Their
# other destination is the bottom of the library, and this engine cannot tell
# the bottom of a library from the top of one — so a `to_graveyard` written
# against this entry would be modelling a scry as a surveil, which is a
# different card. Left with no destination, it is the honest half of the
# answer.
[[effect]]
match = "t:land otag:scry"
look = 1
on = "landdrop"

# Mana rocks and mana dorks: Mind Stone, Arcane Signet, the Talismans, Birds of
# Paradise, Elvish Mystic, and every future printing that taps for one.
#
# Because: a rock or dork the `[casting]` line casts is a mana source, and
# Scryfall's `produced_mana` says which colours it makes but not how many
# (ADR-0018). So the amount is declared, keyed by query like every other entry
# here, and on the side of too little: a library entry may understate a card and
# must never overstate one. Gilded Lotus read as one mana is a lower bound.
#
# The tags pick out which cards are rocks and dorks, which card text cannot:
# `{T}: Add` is printed on lands and on a great many cards that are not a
# source anybody casts for its mana. The exclusions drop every card whose mana is
# conditional, delayed, or paid for with more than a tap, because reading one of
# those as an untapped mana a turn would overstate it: it enters tapped or does
# not untap (Worn Powerstone), its mana is restricted in what it may be spent on
# or when it may be made, it depends on what an opponent's land could produce
# (Fellwar Stone, with no opponent, makes nothing — CR 106.7), a second `{T}:
# Add` sits behind an additional cost, or its amount varies (`for each`, `{X}`,
# `an amount of`). A double-faced card is left out whole, because the query
# reads every face and the face that taps for mana need not be the one that is
# cast: Ulvenwald Captive adds one, and only its back face adds two. Lotus
# Cobra's mana is a landfall trigger rather than a tap, so no `{T}: Add` reaches
# it.
#
# ADR-0018 names eight of these exclusions and quotes 353 cards for them; on
# the same day they matched 376 on Scryfall. `can't be spent` (The Mightstone
# and Weakstone), `an amount of` (Alena, Kessig Trapper, which can make none)
# and the double-faced cards are the same rule applied to cards those eight let
# through. Measured on Scryfall, 2026-09-26: 364 cards.
[[effect]]
match = '''(otag:mana-rock or otag:mana-dork) o:"{T}: Add" -o:"enters tapped" -o:"doesn't untap" -o:"Spend this mana only" -o:"can't be spent" -o:"Activate only" -o:"could produce" -o:", {T}: Add" -o:"for each" -o:"{X}" -o:"an amount of" -is:transform -is:mdfc'''
on = "cast"
adds = 1

# Sol Ring and the rocks that tap for two colourless the same way.
#
# Because: the entry above reads every rock as one mana, which is a lower bound
# and for Sol Ring a poor one — two mana on turn one is most of why it is played.
# The same exclusions apply, and this entry comes second so that, last-wins, it
# is the one these cards keep.
#
# Measured on Scryfall, 2026-09-26: 15 cards; the ADR's 17 are these, The
# Mightstone and Weakstone and Ulvenwald Captive.
[[effect]]
match = '''(otag:mana-rock or otag:mana-dork) o:"{T}: Add {C}{C}." -o:"enters tapped" -o:"doesn't untap" -o:"Spend this mana only" -o:"can't be spent" -o:"Activate only" -o:"could produce" -o:", {T}: Add" -o:"for each" -o:"{X}" -o:"an amount of" -is:transform -is:mdfc'''
on = "cast"
adds = 2

# --- Mills (ADR-0017 §2) -----------------------------------------------------
#
# A mill takes cards off the top and puts them in the graveyard, and the
# graveyard is not a destination anybody chose: the card says so. That is the
# one kind of destination this file may state. What such a card lets go to
# hand instead is a choice, and it is still yours: `keep` and `keep_only` say
# what the card allows, and `to_hand` in your own file says which. With no
# `to_hand` an entry keeps nothing, which is what the card does when you choose
# nothing. Each is dealt as one block the turn the `[casting]` line casts the
# card, so a run that never casts it pays nothing for it.
#
# Keyed by name, because the number of cards is printed on each one and no tag
# carries it. Because, for all four: they are the Loam deck's own routes into
# the graveyard, which is where its north star asks Life from the Loam to be.

# Aftermath Analyst: "When this creature enters, mill three cards."
[[effect]]
match = 'name:"Aftermath Analyst"'
on = "cast"
mill = 3

# Malevolent Rumble: "Reveal the top four cards of your library. You may put a
# permanent card from among them into your hand. Put the rest into your
# graveyard." The Eldrazi Spawn it makes is not counted as mana.
[[effect]]
match = 'name:"Malevolent Rumble"'
on = "cast"
mill = 4
keep = 1
keep_only = "is:permanent"

# Midnight Tilling: "Mill four cards, then you may return a permanent card from
# among them to your hand."
[[effect]]
match = 'name:"Midnight Tilling"'
on = "cast"
mill = 4
keep = 1
keep_only = "is:permanent"

# Wrenn and Seven's +1: "Reveal the top four cards of your library. Put all
# land cards revealed this way into your hand and the rest into your
# graveyard." Nobody chooses, so every land goes. Read as activated once, the
# turn the line casts it: a floor, because it can be activated again on every
# turn after that, and its other abilities are not modelled.
[[effect]]
match = 'name:"Wrenn and Seven"'
on = "cast"
mill = 4
keep_every = "t:land"

# --- Draw, then discard (ADR-0017 §3) ----------------------------------------
#
# A draw is one block dealt the turn the `[casting]` line casts the card, and
# a spell drawn that way is cast that same turn if the pool still pays; a land
# drawn that way waits for the next turn's drop. The discard after it is the
# card's to size and the pilot's to choose: this file says how many, whether
# the card picks at random, and which cards it lets go, and your file's
# `[discard] prefer` says which of those go. A forced discard with no list is
# refused by name; "any number" with no list discards nothing; a random one
# reads no list at all.
#
# Keyed by name, because the numbers are printed on each card and no tag
# carries them. Because, for all four: they are the Loam deck's discard
# outlets that put a card from hand into the graveyard off a cast, which is
# where its north star asks Life from the Loam to be.
#
# Not here, each for its own reason:
#
#   * Three Steps Ahead. Its draw-two-discard-one is a Spree mode costing {2}
#     on top of the printed {U}, and nothing yet says a cast costs more than
#     the card's mana cost; read at {U} it would be cast on turns it cannot be.
#   * Cavalier of Flame. "Discard any number of cards, then draw that many" is
#     a discard before a draw whose size the discard decides. At {2}{R}{R}{R}
#     in a three-colour deck it is rarely cast by turn 5, and it is not
#     modelled.

# Frantic Search: "Draw two cards, then discard two cards. Untap up to three
# lands." The untap is read as the three lands that paid for it, which leaves
# the turn's mana where it was before the spell: a floor, because a pilot
# could untap three better ones, and a run that relies on it says so.
[[effect]]
match = 'name:"Frantic Search"'
on = "cast"
draw = 2
discard = 2
untap = 3

# Izzet Charm's third mode: "Draw two cards, then discard two cards." Its
# other two modes are removal and a counter, which no question here asks
# about, so a line that casts it is read as casting it for cards.
[[effect]]
match = 'name:"Izzet Charm"'
on = "cast"
draw = 2
discard = 2

# Desperate Ravings: "Draw two cards, then discard a card at random." The
# card picks, so a `[discard]` list is ignored rather than obeyed. Its
# flashback is a second casting from the graveyard, and it is not modelled.
[[effect]]
match = 'name:"Desperate Ravings"'
on = "cast"
draw = 2
discard = 1
at_random = true

# Borborygmos and Fblthp: "Whenever Borborygmos and Fblthp enters or attacks,
# draw a card, then you may discard any number of land cards." Read on
# entering, the turn the line casts it; the attack is a later turn's and is
# not modelled, which is a floor. Only land cards, so no list makes it
# discard Life from the Loam.
[[effect]]
match = 'name:"Borborygmos and Fblthp"'
on = "cast"
draw = 1
discard_any = true
discard_only = "t:land"

# --- Attack and landfall (#89) -----------------------------------------------
#
# A mill that fires off a permanent the `[casting]` line cast, again and again:
# each time it attacks, or each time a land enters while it is there. Each
# firing is one block dealt where it fired, like a cast's, on the paths where
# it fired. Because, for all three: they are the Loam deck's own, and each
# puts cards off the top into the graveyard its north star asks about.

# Six: "Whenever Six attacks, mill three cards. You may put a land card from
# among them into your hand." It is summoning-sick the turn it is cast, so it
# first attacks the turn after, and every turn from then on. ASSUMED, and
# printed by every run that fires it: no opponent blocks it or removes it.
# Which land it keeps is yours, as `to_hand`. Its retrace is not modelled:
# casting from the graveyard is a second casting no line makes. `name:` finds
# its text anywhere in a name, and Wrenn and Six is in the same deck, so the
# match names the treefolk too.
[[effect]]
match = 'name:"Six" t:treefolk'
on = "attack"
mill = 3
keep = 1
keep_only = "t:land"

# Icetill Explorer: "Landfall — Whenever a land you control enters, mill a
# card." Every land that enters once it is on the battlefield: the next turn's
# drop, since this turn's came before the line, a land a fetchland puts down,
# and a land a spell returns. Its other two lines, an additional land a turn
# and lands played from the graveyard, are not modelled: a floor on the land
# drops, and so on its own mills.
[[effect]]
match = 'name:"Icetill Explorer"'
on = "landfall"
mill = 1

# Lumra, Bellow of the Woods: "When Lumra enters, mill four cards. Then return
# all land cards from your graveyard to the battlefield tapped." Nobody
# chooses: every land in the graveyard comes back, the four's and any an
# earlier mill put there: a reanimation of every land card (ADR-0032), the one
# way onto the battlefield from the graveyard. They took no land drop, come
# back tapped and pay from the next turn where the drop is declared (ADR-0025).
#
# No other reanimation ships. Animate Dead returns one creature, and which one
# is yours (`reanimate_prefer`); Immortal Servitude's X is yours too.
[[effect]]
match = 'name:"Lumra, Bellow of the Woods"'
on = "cast"
mill = 4
reanimate = "t:land"
reanimate_count = "all"

# --- Upkeep (#139) -----------------------------------------------------------
#
# A mill at the beginning of your upkeep, once for each copy the `[casting]`
# line cast on an earlier turn, before that turn's draw: what it mills is what
# the turn would have drawn, and the draw comes from under it. ASSUMED, and
# printed by every run that fires one: nobody removes the permanent. Because,
# for both: #139 found them in a Cid mill deck, which wants its own Cids in its
# graveyard and mills itself every turn to get them there.

# Stillness in Motion: "At the beginning of your upkeep, mill three cards. Then
# if your library has no cards in it, exile this enchantment and put five
# cards from your graveyard on top of your library in any order." The second
# sentence needs an empty library, and a question whose library can run out
# before its last draw is refused before it is asked, so no answered game
# reaches it.
[[effect]]
match = 'name:"Stillness in Motion"'
on = "upkeep"
mill = 3

# Out of the Tombs: "At the beginning of your upkeep, put two eon counters on
# this enchantment, then mill cards equal to the number of eon counters on
# it." So 2, then 4, then 6: two more each upkeep. Its replacement of a draw
# from an empty library needs an empty library, which no answered game has.
[[effect]]
match = 'name:"Out of the Tombs"'
on = "upkeep"
mill = 2
grows = 2
