<svg class="suture" viewBox="0 0 68 68" aria-hidden="true">
  <defs>
    <linearGradient id="pe-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4052"/>
      <stop offset=".45" stop-color="#9aa3b5"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#9aa3b5"/>
      <stop offset="1" stop-color="#3a4052"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-.6 -.6;.6 .6" dur="2.4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="pe-needle-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b6274"/>
      <stop offset=".55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8e97aa"/>
    </linearGradient>
    <symbol id="pe-needle" overflow="visible">
      <path d="M-8 0 C -5 -2.6, 4 -2.6, 8 0 L 3.5 .9 C 0 -.5, -4.5 -.5, -8 0 Z" fill="url(#pe-needle-steel)"/>
      <circle cx="-6.2" cy="0" r=".7" fill="#08090d"/>
    </symbol>
  </defs>
  <g class="suture-etch">
    <circle cx="34" cy="34" r="30"/>
    <circle cx="34" cy="34" r="22"/>
    <path id="pe-s1" d="M34 6 C 50 14, 50 30, 34 34 C 18 38, 18 54, 34 62"/>
    <path id="pe-s2" d="M8 34 C 16 18, 30 18, 34 34 C 38 50, 52 50, 60 34"/>
    <path id="pe-s3" d="M14 14 C 26 20, 28 28, 34 34 C 40 40, 42 48, 54 54"/>
  </g>
  <!-- Each needle pulls its thread along one curve; the thread holds, then is drawn out. -->
  <path class="suture-thread" d="M34 6 C 50 14, 50 30, 34 34 C 18 38, 18 54, 34 62" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;0;0;-100" keyTimes="0;.45;.7;1" dur="3.6s" repeatCount="indefinite"/>
  </path>
  <path class="suture-thread" d="M8 34 C 16 18, 30 18, 34 34 C 38 50, 52 50, 60 34" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;0;0;-100" keyTimes="0;.45;.7;1" dur="3.6s" begin=".3s" repeatCount="indefinite"/>
  </path>
  <path class="suture-thread" d="M14 14 C 26 20, 28 28, 34 34 C 40 40, 42 48, 54 54" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;0;0;-100" keyTimes="0;.45;.7;1" dur="3.6s" begin=".6s" repeatCount="indefinite"/>
  </path>
  <g class="suture-staples">
    <path d="M44 14 l-3 4"/>
    <path d="M24 47 l3 4" style="animation-delay:.2s"/>
    <path d="M18 25 l3 3" style="animation-delay:.4s"/>
    <path d="M49 42 l-3 3" style="animation-delay:.5s"/>
    <path d="M22 22 l2 -3" style="animation-delay:.7s"/>
    <path d="M45 47 l-2 3" style="animation-delay:.9s"/>
  </g>
  <use href="#pe-needle"><animateMotion dur="3.6s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;.45;1" calcMode="linear"><mpath href="#pe-s1"/></animateMotion></use>
  <use href="#pe-needle"><animateMotion dur="3.6s" begin=".3s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;.45;1" calcMode="linear"><mpath href="#pe-s2"/></animateMotion></use>
  <use href="#pe-needle"><animateMotion dur="3.6s" begin=".6s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;.45;1" calcMode="linear"><mpath href="#pe-s3"/></animateMotion></use>
  <path class="suture-core" stroke="url(#pe-blade)" d="M34 30 L38 34 L34 38 L30 34 Z"/>
</svg>
