[package]
name = "chancellor-of-the-spires"
description = "A rules engine for Magic: the game as a typed state machine, and what is true now derived by ascent from Insight's ability trees"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# `chancellor-logs` fetches and measures the corpus of real games (README,
# "Real games"); the library itself never touches the network.
[[bin]]
name = "chancellor-logs"
path = "src/bin/chancellor-logs.rs"

[dependencies]
ascent = { workspace = true }
vivisurgeons-insight = { workspace = true }
imbl.workspace = true
comemo.workspace = true
chip-decklist.workspace = true
chip-scryfall.workspace = true
thiserror.workspace = true

# ascent's `par` feature pulls in rayon, which has no threads to run on in
# wasm32-unknown-unknown, and the engine has to run in Meldweb's browser
# build. Natively it gets `ascent_par!` for search.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ascent = { workspace = true, features = ["par"] }
# Only `chancellor-logs` uses these: it fetches PDBot's logs and reads the
# Scryfall bulk file, neither of which a browser build does.
anyhow.workspace = true
facet-json.workspace = true
ureq.workspace = true
