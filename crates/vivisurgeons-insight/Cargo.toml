[package]
name = "vivisurgeons-insight"
description = "Oracle text in, a typed ability tree out, and a count of how much of Magic that covers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "insight"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true

# Only the `insight` binary downloads anything. Native-only, so the library,
# and Chancellor and Mirage Mockery above it, build for wasm32: rustls' ring
# needs getrandom's "js" feature there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq.workspace = true
