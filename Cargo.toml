[workspace]
resolver = "2"
# Meldweb Curator's crate is named rather than globbed: its directory also
# holds the TypeScript app, which has no Cargo.toml.
members = [
    "crates/ichormoon-gauntlet/*",
    "crates/reality-chip/*",
    "crates/meldweb-curator/wasm",
    "crates/vivisurgeons-insight",
    "crates/chancellor-of-the-spires",
    "crates/chancellor-of-the-spires/cr",
    "crates/phyrexian-metamorph/*",
    "crates/mirage-mockery/*",
]
# Gitaxian Probe is a workspace of its own (crates/gitaxian-probe/Cargo.toml), so
# a plain `cargo` here resolves neither V8 nor the build-time download of
# Delver's engine files, and the flake never sees either.
exclude = ["crates/gitaxian-probe"]

[workspace.metadata.crane]
# crane reads the package name from the root Cargo.toml, which a virtual
# workspace manifest does not have. Without this it warns and uses a placeholder.
name = "ichormoon-gauntlet"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cramt/progress-engine"

[workspace.dependencies]
anyhow = "1"
facet = { version = "0.46", features = ["nonzero"] }
facet-json = "0.46"
facet-toml = "0.46"
figue = "4"
libm = "0.2"
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
rand = "0.9"
rand_chacha = "0.9"
regex = "1"
csv = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
imbl = "7"
ascent = { version = "0.8.1", default-features = false }
pdf-writer = "0.15"

chip-decklist = { path = "crates/reality-chip/decklist" }
chip-scryfall = { path = "crates/reality-chip/scryfall" }
gauntlet-criteria = { path = "crates/ichormoon-gauntlet/criteria" }
gauntlet-toml = { path = "crates/ichormoon-gauntlet/toml" }
gauntlet-sim = { path = "crates/ichormoon-gauntlet/sim" }
chip-stats = { path = "crates/reality-chip/stats" }
vivisurgeons-insight = { path = "crates/vivisurgeons-insight" }
metamorph-sheet = { path = "crates/phyrexian-metamorph/sheet" }
mockery-core = { path = "crates/mirage-mockery/core" }

# meldweb-wasm ships over the network, so it trades build time for bytes. A
# profile of its own leaves Gauntlet's release build as it was.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# `insight <card>` scans the 200 MB oracle bulk file, which takes 14s at
# opt-level 0 and well under a second optimised.
[profile.dev.package.vivisurgeons-insight]
opt-level = 1
[profile.dev.package.serde_json]
opt-level = 1

# Mirage Mockery's tests lay out cards through Typst and scan the whole card
# index for the real-card refusal, which took 195s at opt-level 0 and 3s
# optimised.
[profile.dev.package.typst-layout]
opt-level = 1
[profile.dev.package.typst-library]
opt-level = 1
[profile.dev.package.typst-realize]
opt-level = 1
[profile.dev.package.typst-eval]
opt-level = 1
[profile.dev.package.typst-render]
opt-level = 1
[profile.dev.package.typst-pdf]
opt-level = 1
[profile.dev.package.krilla]
opt-level = 1
[profile.dev.package.tiny-skia]
opt-level = 1
[profile.dev.package.usvg]
opt-level = 1
[profile.dev.package.rustybuzz]
opt-level = 1
[profile.dev.package.ttf-parser]
opt-level = 1
[profile.dev.package.chip-scryfall]
opt-level = 1
[profile.dev.package.facet-json]
opt-level = 1
