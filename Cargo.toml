[package]
name = "dioxus-native-android-hello"
version = "0.1.0"
edition = "2024"

# Android loads the app as a shared library through NativeActivity; the binary
# target is the same app on the desktop, so both entry points stay in sync.
[lib]
name = "dioxus_native_android_hello"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dioxus-native-android-hello"
path = "src/main.rs"

[features]
default = ["skia"]

# Pick exactly one renderer. On Android only skia is usable today: vello paints a
# black screen and vello-hybrid stutters badly.
# https://github.com/DioxusLabs/blitz/issues/377
skia = ["dioxus-native/skia"]
vello = ["dioxus-native/vello"]
vello-hybrid = ["dioxus-native/vello-hybrid"]

[dependencies]
dioxus-native = { version = "0.8.0-alpha.1", default-features = false, features = [
  "prelude",
  "system-fonts",
] }

# Pulls a stub in place of the real IDNA tables, which otherwise drag the whole
# of ICU into the APK for URL parsing this app never does. Upstream's own
# examples carry the same pin. Drop it if you enable dioxus-native's `net`
# feature and start fetching real URLs.
# https://github.com/hsivonen/idna_adapter
idna_adapter = "=1.0.0"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.0", features = ["native-activity"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
