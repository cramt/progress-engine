[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.metadata.crane]
# crane reads the package name from the root Cargo.toml, which a virtual
# workspace manifest does not have. Without this it warns and uses a placeholder.
name = "ichormoon-gauntlet"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cramt/progress-engine"

[workspace.dependencies]
anyhow = "1"
facet = { version = "0.46", features = ["nonzero"] }
facet-json = "0.46"
facet-toml = "0.46"
figue = "4"
libm = "0.2"
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
rand = "0.9"
rand_chacha = "0.9"
regex = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", features = ["rt", "time"] }

pe-decklist = { path = "crates/pe-decklist" }
pe-scryfall = { path = "crates/pe-scryfall" }
gauntlet-criteria = { path = "crates/gauntlet-criteria" }
gauntlet-toml = { path = "crates/gauntlet-toml" }
gauntlet-sim = { path = "crates/gauntlet-sim" }
pe-stats = { path = "crates/pe-stats" }
