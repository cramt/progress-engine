[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cramt/progress-engine"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libm = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

pe-decklist = { path = "crates/pe-decklist" }
pe-scryfall = { path = "crates/pe-scryfall" }
pe-criteria = { path = "crates/pe-criteria" }
pe-stats = { path = "crates/pe-stats" }
