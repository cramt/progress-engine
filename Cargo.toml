[package]
name = "progress-engine"
version = "0.1.0"
edition = "2021"
description = "Draw-probability tests for Magic: The Gathering decklists"
license = "MIT"
repository = "https://github.com/cramt/progress-engine"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libm = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
