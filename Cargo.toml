[workspace]
resolver = "2"
members = ["crates/*/*"]

[workspace.metadata.crane]
# crane reads the package name from the root Cargo.toml, which a virtual
# workspace manifest does not have. Without this it warns and uses a placeholder.
name = "ichormoon-gauntlet"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cramt/progress-engine"

[workspace.dependencies]
anyhow = "1"
facet = { version = "0.46", features = ["nonzero"] }
facet-json = "0.46"
facet-msgpack = "0.46"
facet-toml = "0.46"
facet-value = "0.46"
figue = "4"
libm = "0.2"
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
rand = "0.9"
rand_chacha = "0.9"
regex = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }

deno_core = "0.412"
# deno_core re-exports deno_error and the two must agree exactly: a caret range
# resolves to a newer one and op2 stops matching its own error type.
deno_error = "=0.7.1"
sevenz-rust2 = "0.23"

dioxus-native = { version = "0.8.0-alpha.1", default-features = false, features = [
  "prelude",
  "system-fonts",
] }
android-activity = { version = "0.6.0", features = ["native-activity"] }
# Stubs out the real IDNA tables, which otherwise drag the whole of ICU into the
# APK for URL parsing this app never does. Upstream's own examples carry the
# same pin. Drop it if dioxus-native's `net` feature is ever enabled.
# https://github.com/hsivonen/idna_adapter
idna_adapter = "=1.0.0"

chip-decklist = { path = "crates/reality-chip/decklist" }
chip-scryfall = { path = "crates/reality-chip/scryfall" }
gauntlet-criteria = { path = "crates/ichormoon-gauntlet/criteria" }
gauntlet-toml = { path = "crates/ichormoon-gauntlet/toml" }
gauntlet-sim = { path = "crates/ichormoon-gauntlet/sim" }
chip-stats = { path = "crates/reality-chip/stats" }
gitaxian-probe-engine = { path = "crates/gitaxian-probe/engine" }

# gitaxian-probe-app ships as an APK, where binary size is the budget that
# matters. The workspace's other products are CLIs and do not care.
[profile.release]
opt-level = "s"
lto = true
strip = true

# deno_core has no Android arm in uv_compat/tty.rs. `vendor/deno_core` is not
# committed - the flake patches the crate and symlinks the result here, so this
# resolves only inside `nix develop`. See flake.nix for the why and the removal
# condition.
[patch.crates-io]
deno_core = { path = "vendor/deno_core" }
