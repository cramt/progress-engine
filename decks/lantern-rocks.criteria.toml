# The commander, cast from the command zone, with the deck's mana rocks in the
# line (ADR-0018).
#
# `lantern-commander.criteria.toml` asked the same thing with only lands paying
# until #100 folded it into the north star (42.50% / 51.49% at turn 4, 53.01% /
# 61.30% at turn 5, play / draw). This file names the rocks as well, so a rock the line casts is a mana source
# from then on: Sol Ring adds {C}{C}, Mind Stone {C}, Arcane Signet one of
# Rashmi's green, blue and red, and each Talisman {C} or one of its two
# colours. A rock's mana pays only for what the line casts after it that turn,
# never for itself. The deck has no red land that is not also a Talisman's red,
# so the Talismans are what move this number most.
#
# ITS OWN FILE, DELIBERATELY. A `[casting]` line is one pool with every gate in
# the file that declares it, so the commander with rocks and nothing else is a
# file of its own. `lantern.criteria.toml` asks the commander inside the whole
# north-star line, where the rocks also pay for the tutors; its "commander
# half" criterion is that line's version of this question.
#
# The line: cast Rashmi the moment the pool pays, and otherwise grow the pool —
# the coloured rocks before the colourless one. Fellwar Stone is left out: it
# costs two and, with no opponent at the table, makes nothing (CR 106.7), and
# a line that cast it would name it as counted as making no mana.
#
# A floor still, for the reasons every mana number here is: the Treasure Rashmi
# makes is not a source, and the lands whose tapped-ness is the pilot's choice
# are assumed to enter tapped.
#
# `checker/checker.py` asks both criteria independently, from the rules and
# ADR-0018, with its own line model.

[casting]
prefer = [
  'name:"Rashmi and Ragavan"',
  'name:"Sol Ring"',
  'name:"Arcane Signet"',
  'name:"Talisman of Creativity"',
  'name:"Talisman of Curiosity"',
  'name:"Talisman of Impulse"',
  'name:"Mind Stone"',
]

[[criterion]]
name = "Rashmi and Ragavan cast by turn 4, rocks in the line"
require = [{ turn = 4, cast = 'name:"Rashmi and Ragavan"', min = 1 }]

[[criterion]]
name = "Rashmi and Ragavan cast by turn 5, rocks in the line"
require = [{ turn = 5, cast = 'name:"Rashmi and Ragavan"', min = 1 }]
