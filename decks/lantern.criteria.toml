# "Third Lantern Control" — https://archidekt.com/decks/25088186
#
# WHAT THESE NUMBERS ARE
# ----------------------
# progress-engine counts cards SEEN, never cards cast. There is no mana model
# (upstream #10). So every branch below that involves casting something is an
# UPPER BOUND on how often the line is actually available: the card was drawn
# by that turn, and whether you could pay for it is not modelled.
#
# The one exception is the Urza's Saga branch, and it is the reason the branch
# is written separately. Urza's Saga is a land, so it arrives on a land drop,
# and chapter III fetches Lantern of Insight onto the battlefield for no mana
# at all. "Drawn by turn 3" really is close to "available on turn 5" there.
# It still assumes you spend the turn-3 land drop on Saga rather than on a
# colour you needed, which is a choice the engine cannot see.
#
# Also not modelled:
#   * Mulligans. Turn 0 is a kept seven.
#   * On the play vs on the draw (default is on the play; --draw for the other).
#   * Tutors as tutors. A tutor is counted as one card matching one query. The
#     engine does not know it fetches anything, so the branches below encode
#     "I drew a card that can go get it" and the turn arithmetic is mine, not
#     the tool's.
#   * Nothing about the game beyond your own draws: interaction, being attacked,
#     an opponent exiling the Lantern.
#
# Each tutor route also carries a clause saying Lantern of Insight is still in
# the LIBRARY at that turn, so that "I drew a tutor" cannot be counted as a
# line when the Lantern is already in hand. It turns out to move the total by
# nothing, because route 1 covers exactly the complement -- which is the union
# behaving correctly rather than the clause being pointless.
#
# The deck as exported is 100 cards: 1 commander (Rashmi and Ragavan) and a
# 99-card library. All probabilities are over that 99.

# --- The north-star question ----------------------------------------------
# "How often is there a line to Lantern of Insight by turn 5?"
#
# THE TUTOR SET IS NOT THE OWNER'S CATEGORY, AND THAT IS THE POINT.
# The owner's "Tutor Package" is 11 cards. Only 7 of them can reach Lantern
# of Insight, which is a mana value 1 artifact:
#   Trinket Mage            {2}{U}  artifact mv<=1 to hand
#   Fabricate               {2}{U}  any artifact to hand
#   Artificer's Intuition   {1}{U}  + {U} and discard an artifact
#   Dizzy Spell             {U}     transmute {1}{U}{U}, mv 1
#   Tezzeret, Cruel Captain {3}     -3, starts on 4 loyalty
#   Whir of Invention       {X}{U}{U}{U}  X=1, onto the battlefield
#   Tezzeret the Seeker     {3}{U}{U}  -X for X=1, onto the battlefield
# The four that cannot:
#   Trophy Mage      finds mana value exactly 3
#   Expedition Map   finds a land (it can find Urza's Saga; see below)
#   Goblin Engineer  puts the artifact in the graveyard, not in hand
#   Repurposing Bay  needs an artifact to sacrifice first
# Counting all 11 would inflate this criterion. The difference is measured by
# the "coarse" criterion further down.
#
# THRESHOLD: 0.75. One copy of Lantern plus seven cards that find it plus a
# free land-drop route is the deck's entire premise, so three games in four is
# the design target. Remember this is an upper bound.

[[criterion]]
name = "a line to Lantern of Insight by turn 5 (upper bound: no mana model)"
at_least = 0.75

  # Route 1: just drew it. Lantern costs {1}; any land casts it.
  [[criterion.any_of]]
  require = [
    { turn = 5, query = 'name:"Lantern of Insight"', min = 1 },
  ]

  # Route 2: a three-mana-or-less tutor that puts it in HAND, drawn by turn 4,
  # so it is cast on turn 4 and Lantern on turn 5. The land clause is a crude
  # mana proxy and it is NECESSARY, NOT SUFFICIENT: it counts lands drawn, not
  # lands played (HANDS.md hand 4), and it says nothing about colours.
  [[criterion.any_of]]
  require = [
    { turn = 4, query = '''name:"Trinket Mage" or name:"Fabricate" or name:"Artificer's Intuition" or name:"Dizzy Spell" or name:"Tezzeret, Cruel Captain"''', min = 1 },
    { turn = 4, query = "t:land", min = 3 },
    { turn = 4, query = 'name:"Lantern of Insight"', zone = "library", min = 1 },
  ]

  # Route 3: a four-or-five-mana tutor that puts it straight onto the
  # BATTLEFIELD, so it can arrive the turn the tutor is cast. Same land caveat,
  # one land higher.
  [[criterion.any_of]]
  require = [
    { turn = 5, query = 'name:"Whir of Invention" or name:"Tezzeret the Seeker"', min = 1 },
    { turn = 5, query = "t:land", min = 4 },
    { turn = 5, query = 'name:"Lantern of Insight"', zone = "library", min = 1 },
  ]

  # Route 4: Urza's Saga, drawn by turn 3, played as the turn-3 land drop,
  # chapter III on turn 5 puts Lantern onto the battlefield. NO MANA AT ALL.
  # This is the only branch here that the missing mana model does not weaken.
  [[criterion.any_of]]
  require = [
    { turn = 3, query = "name:\"Urza's Saga\"", min = 1 },
  ]

# --- The same question with the owner's category, uncorrected -------------
# STRUCTURALLY IDENTICAL to the criterion above -- same four routes, same
# turns, same land clauses. The ONLY difference is that routes 2 and 3 ask
# about the whole 11-card "Tutor Package" instead of the 7 cards that can
# actually find a mana value 1 artifact. The gap between the two numbers is
# the price of an unstated definition, which is the thing this tool exists to
# make visible. No at_least: this is a measuring stick, not a target.

[[criterion]]
name = "same four routes, all 11 Tutor Package cards (OVERCOUNTS)"

  [[criterion.any_of]]
  require = [{ turn = 5, query = 'name:"Lantern of Insight"', min = 1 }]

  [[criterion.any_of]]
  require = [
    { turn = 4, query = 'cat:"Tutor Package"', min = 1 },
    { turn = 4, query = "t:land", min = 3 },
    { turn = 4, query = 'name:"Lantern of Insight"', zone = "library", min = 1 },
  ]

  [[criterion.any_of]]
  require = [
    { turn = 5, query = 'cat:"Tutor Package"', min = 1 },
    { turn = 5, query = "t:land", min = 4 },
    { turn = 5, query = 'name:"Lantern of Insight"', zone = "library", min = 1 },
  ]

  [[criterion.any_of]]
  require = [{ turn = 3, query = "name:\"Urza's Saga\"", min = 1 }]

# --- The free route on its own --------------------------------------------
# Worth isolating because it is the only number in this file that does not
# assume free mana.
# THRESHOLD: none. One copy of a land in 99 cards by turn 3 is what it is;
# asserting on it would be asserting on arithmetic.

[[criterion]]
name = "Urza's Saga drawn by turn 3 (no mana assumed)"
require = [{ turn = 3, query = "name:\"Urza's Saga\"", min = 1 }]

# --- Distributions --------------------------------------------------------

[[expect]]
name = "Lantern-capable tutors seen by turn 5 (drawn, not cast)"
turn = 5
query = '''name:"Trinket Mage" or name:"Fabricate" or name:"Artificer's Intuition" or name:"Dizzy Spell" or name:"Tezzeret, Cruel Captain" or name:"Whir of Invention" or name:"Tezzeret the Seeker"'''

[[expect]]
name = "whole Tutor Package seen by turn 5 (drawn, not cast)"
turn = 5
query = 'cat:"Tutor Package"'

[[expect]]
name = "lands in opener"
turn = 0
query = "t:land"

# --- TWO MORE WAYS THESE NUMBERS ARE OPTIMISTIC ---------------------------
#
# 1. `t:land` matches 40 cards in this deck, and only 32 of them are lands you
#    can play as your land drop:
#      32  actual lands
#       7  modal double-faced cards (Jwari Disruption, Spikefield Hazard,
#          Sea Gate Restoration, Silundi Vision, Bala Ged Recovery,
#          Shatterskull Smashing, Valakut Awakening) -- a land only if you
#          choose not to cast the front half, and several enter tapped
#       1  Search for Azcanta // Azcanta, the Sunken Ruin, which is a {1}{U}
#          enchantment that TRANSFORMS. You can never play it as a land.
#    This matches Scryfall's own `t:land`, which searches every face, so it is
#    not a bug in the tool -- but it means the land clauses in routes 2 and 3
#    are satisfied by hands that cannot actually make that much mana. There is
#    no query that says "front face is a land", so this cannot be corrected
#    here. Both land clauses should be read as generous.
#
# 2. Nothing here models tapped lands. Hedge Maze, the Triome, the Bridges and
#    several MDFC backs all enter tapped. Even with a fully tagged index,
#    `otag:tapland` only selects cards -- no clause can say "untapped mana
#    available", because that is the mana model again.
#
# --- A LIMIT OF THE TOOL THAT WAS ONE, AND NO LONGER IS -------------------
# This file used to be answered exactly on the play and REFUSED with --draw:
#   "too wide to answer exactly: 28840812 compositions across 7 groups"
# One extra card by turn 5 crossed the enumeration ceiling, so the on-the-draw
# figures had to come from --draw --simulate and were approximate -- which is
# most of your games, since in a four-player pod you are on the draw three
# times in four.
#
# That was because the enumeration was sized once for the whole file: seven
# groups and every checkpoint, whatever any individual question read. Since
# upstream #31 it is sized per question. The widest question here is the
# four-route criterion, at 6 groups over three checkpoints -- 72,072
# compositions on the play and 108,108 on the draw -- so BOTH are now answered
# exactly, and the [[expect]] tables below cost 12 compositions each instead of
# widening everything else.
#
# The numbers on the play did not move by a digit. They were exact before and
# they are exact now; only the enumeration behind them got smaller.

# --- THE INDEX THESE NUMBERS WERE PRODUCED AGAINST ------------------------
# decks/index.jsonl was built with `sync --from <bulk file>`, because
# `progress-engine sync` could not complete: it fetches six oracle tags from
# the Scryfall search API with no delay between requests and got HTTP 429 on
# the fifth one, four separate times, discarding the whole 24.7 MB download
# each time. `--from` succeeds but SKIPS ORACLE TAGS ENTIRELY.
#
# Consequence: the autoloading effect library, whose two entries are keyed on
# `t:land otag:surveil` and `t:land otag:scry`, matches ZERO cards on this
# index, and the run reports `"effects": []` without warning. For this file
# that changes nothing -- it asks about no zone but `hand` and `library` -- but
# it would silently change any graveyard question. If you rebuild the index
# with a complete `sync`, re-run and compare: `provenance.index_updated_at`
# will stop being null, which is how you will know.
