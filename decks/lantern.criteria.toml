# "Third Lantern Control" — https://archidekt.com/decks/25088186
#
# THE QUESTION
# ------------
# VISION.md's first north star, as its owner defines it (CONTEXT.md, *North
# star*; #100): by the end of turn N, LANTERN OF INSIGHT IS ON THE BATTLEFIELD
# AND RASHMI AND RAGAVAN HAS BEEN CAST — by any line the pilot's own cards
# allow, out of one mana budget, with the opponents out of scope. One
# criterion per turn, and nothing in any of them but those two clauses: every
# route to the Lantern is an effect the line pays for, so no clause stands in
# for a route and none needs a mana proxy.
#
#                              play              draw
#   north star by turn 4    7.12% ± 0.06     9.35% ± 0.07
#   north star by turn 5   31.09% ± 0.10    38.18% ± 0.11
#   north star by turn 6   44.02% ± 0.11    52.01% ± 0.11
#   north star by turn 7   52.22% ± 0.11    59.48% ± 0.11
#
# Sampled, 200,000 hands a seat: see the width note at the foot of the file.
# `checker/` plays the same line and land drop from the rules, turn by turn,
# and holds every turn of the curve, both seats, to these answers.
#
# NO BOUND. This file used to carry `at_least = 0.75`, set when it asked a much
# easier question. Its owner will choose a bound, and the turn it applies to,
# from this curve (#100); until then every criterion here is informational.
#
# BESIDE THE NUMBER THIS FILE USED TO REPORT
# ------------------------------------------
# Until #100 this file asked "a line that resolves Lantern of Insight by turn
# 5": fourteen `any_of` branches of hand counts and `can_cast` gates, no
# commander, each gate reading the lands in whatever order suited it. It read
# 47.10% ± 0.11 on the play and 54.34% ± 0.11 on the draw. That is a different
# question and the two numbers are not a before and after:
#
#   * it did not ask for the commander, which costs {1}{G}{U}{R} out of the
#     same lands the routes spend — half of the north star, and a hard one:
#     Rashmi cast by turn 5 on this line reads about 62% on the play;
#   * each gate was clairvoyant about the lands — played in the order that
#     suited that clause, knowing the draws — where this line plays the lands
#     a declared list chooses, one a turn, and pays everything out of them;
#   * it paid nothing for rocks (lands only), priced no route to the
#     battlefield beside a hand route, and counted Artificer's Intuition,
#     which is not modelled here yet.
#
# THE LINE
# --------
# Every route the engine models, each as the effect that is the route:
#
#   the Lantern cast        {1}, from hand
#   Trinket Mage            {2}{U}, enters and finds it, to hand
#   Fabricate               {2}{U}, finds it, to hand
#   Tezzeret, Cruel Captain {3}, −3 off four loyalty the turn he is cast, to hand
#   Whir of Invention       {1}{U}{U}{U}, X = 1 declared, onto the battlefield
#   Tezzeret the Seeker     {3}{U}{U}, −1 the turn he is cast, onto the battlefield
#   Dizzy Spell             transmute {1}{U}{U} declared, to hand
#   Urza's Saga             a land drop; chapter III two turns later puts it
#                           onto the battlefield, and the Saga is sacrificed
#   Expedition Map          {1}, then {2}, {T}, sacrifice: the Saga, to hand;
#                           paid before the drop when the Saga is what the drop
#                           would play (HANDS.md hand 42)
#
# and the rocks of ADR 0018 — Sol Ring, Arcane Signet, the three Talismans and
# Mind Stone — which the line casts and which pay for what it casts after them.
# Fellwar Stone is left out: with no opponent it makes nothing (CR 106.7).
#
# The order, and why:
#
#   1. The Lantern. {1}, and the point of every other entry.
#   2. Sol Ring. {1} for {C}{C}: it pays for what follows it the same turn, so
#      casting it first never costs anything below it a turn.
#   3. Rashmi and Ragavan, the moment the pool pays. The commander is half the
#      question and has no route but its own four mana; each turn it waits
#      behind a tutor is a turn the other half had to be worth it.
#   4. Whir of Invention, then Tezzeret the Seeker: a tutor that lands the
#      Lantern needs no second payment.
#   5. The hand tutors — Trinket Mage, Fabricate, Cruel Captain, one entry,
#      since each is three mana and finds the same card — then Dizzy Spell.
#      A Lantern they find is cast the same turn if {1} is left.
#   6. Expedition Map, cast whenever nothing above it is, and activated for
#      the Saga whenever the pool pays.
#   7. The two-mana rocks, coloured first: {2} for one a turn, cast on a turn
#      nothing above them was payable.
#
# Measured, on the play then the draw, turn 5, with the land drop below:
#
#   the line above                                        31.09%   38.18%
#   Map after the rocks                                   31.39%   38.34%
#   hand tutors before the battlefield tutors             31.14%   38.31%
#   Sol Ring with the other rocks                         31.13%   38.33%
#   Map before Rashmi                                     30.93%   37.82%
#   every rock before Rashmi                              30.63%   38.05%
#   the battlefield tutors before Rashmi                  29.86%   36.41%
#   Rashmi after every tutor                              27.28%   32.71%
#
# All ± 0.10 or 0.11. The first four are the same number inside their error:
# where the Map, Sol Ring and the tutors sit among themselves moves nothing
# measurable. Where the commander sits does, by up to four points on the play
# and five and a half on the draw, and it goes first of the four-mana cards.
#
# THE LAND DROP
# -------------
# Urza's Saga needs one declared: its chapter is set up by the drop, so the run
# has to say which land it played. The list below is the whole manabase, one
# entry per kind of land, in this order:
#
#   * Urza's Saga, the moment it is held (and the land the Map goes and gets).
#   * The lands that enter tapped, most colours first. A tapped land costs
#     least on the turns nothing is cast yet, so it goes down first; the ten
#     whose tapped-ness is the pilot's choice are read as tapped, as every
#     run here reads them.
#   * Maze of Ith, which makes no mana at all.
#   * The untapped lands, most colours first — the fetchlands, which pay any
#     of Rashmi's three here, then the duals, then one colour, blue first —
#     and the colourless utility lands last. Rashmi wants three colours and
#     Whir three blue, so the colours go down while they can still matter.
#
# Measured, the line above, turn 5, play then draw:
#
#   the list below                                        31.09%   38.18%
#   the same kinds, fewest colours first                  28.62%   34.87%
#   Saga, then every tapped land, then any land           29.43%*  35.87%*
#   Saga, then any land                                   24.30%*  29.47%*
#   Saga, then the untapped lands, then any land          22.31%*  27.29%*
#
# Playing the tapped lands first is worth 5.1 points on the play and 6.4 on
# the draw over any land after the Saga, and most colours first
# rather than fewest another 2.5 and 3.3. The starred rows put lands that differ in
# what they make inside one entry, and there a tie is broken by the engine's
# land groups rather than by the decklist as README says (see "A TIE THE ENGINE
# BREAKS BY GROUP" below): read them as the engine's, not the stated rule's.
# The list below has one kind of land per entry, so no tie in it matters.
#
# A TIE THE ENGINE BREAKS BY GROUP
# --------------------------------
# README says a tie inside one `[land_drop]` entry goes to the card the
# decklist names first. Measured on small decks against `checker/`, the engine
# instead merges lands that make the same mana the same way into one group,
# ranked where the first of them sits in the list: so with Training Center,
# Tropical Island and Turbulent Springs in one entry, Turbulent Springs is
# played before Tropical Island. On the whole deck, "Saga, then every tapped
# land, then any land" reads 29.43% / 35.87% in the engine and 29.8% / 36.2%
# played by the stated rule. It is filed rather than fixed here, and this file
# does not depend on it. And a look that routes nothing breaks no tie: Hedge
# Maze's surveil leaves every card on top, so it is not a deeper look.
#
# WHAT IS NOT MODELLED, AND WHICH WAY IT MOVES THE NUMBER
# -------------------------------------------------------
# Down — this is a floor for each of these:
#   * Artificer's Intuition, a fourth hand tutor, waits for its discard (#99).
#     ADR 0019 measured it at about three points on the play.
#   * Digging: Sensei's Divining Top, Search for Azcanta and Dakra Mystic see
#     deeper and are not modelled (ADR 0017); nor is any card that draws.
#   * Goblin Engineer, Repurposing Bay and Inventors' Fair, refused by
#     ADR 0019 with their numbers (about 1.5, 0.7 and 0.2 points).
#   * Improvise: Whir pays its four in full. A larger X is never needed.
#   * Rashmi's Treasure: 0.2 to 0.4 points at turn 5 (docs/research/
#     rashmi-treasure.md), not built. Her free cast is an opponent's card.
#   * The ten lands that may enter untapped for a choice, read as tapped.
#   * The pilot adapting. The land drop and the line are fixed priorities; a
#     pilot who sequences lands for the hand in front of them, or holds the
#     Map when the Saga is already drawn, does at least as well.
#   * Mulligans. Turn 0 is a kept seven: no [mulligan] is declared, because
#     the keep rule is the owner's to state.
# Up — this is a ceiling for these:
#   * A fetchland pays as if one of the lands it finds is still in the library.
#   * Opponents. The owner's definition leaves them out: no counterspell on a
#     tutor, no removal on the Saga before chapter III or on the Lantern after.
#
# WHAT ELSE IS ASKED HERE, AND WHERE THE ROUTES LIVE
# --------------------------------------------------
# A `[casting]` line is one pool with every question in its file, and every
# question here is priced by it, so the only other questions in this file are
# the north star's own halves, which say which half binds, and the Lantern
# cast from hand, which says how much of the Lantern half is a hard cast.
#
# Each route on its own, and what adding it was worth, stays in the files
# that measured it, and they are kept as that evidence: lantern-route-b (Trinket
# Mage), lantern-route-c (the Saga, exact and checkable by hand),
# lantern-route-seeker (the Seeker), lantern-route-tutors (Dizzy Spell and
# Whir), lantern-route-map (the Map), lantern-rocks and lantern-rocks-first
# (the commander with rocks, in two orders). Their question names differ from
# every name here, so `checker/compare.py` never confuses one file's answer for
# another's. The commander on its own, with only lands paying, was
# lantern-commander.criteria.toml; it is folded into this file, whose line
# asks the commander beside everything else it spends.
#
# HOW WIDE THIS IS
# ----------------
# Read it off the run: `jq '.enumerations'`. Each turn is one class of 33
# groups — every card the line names, each land kind the drop ranks with its
# palette kept whole, and the effects — and turn 5 is 18,240,576,187,977
# compositions on the play and 601,939,014,203,241 on the draw, six and eight
# orders of magnitude over the 5,000,000 ceiling. So every number here is
# SAMPLED, 200,000 hands, in about 6 seconds a seat. The old union was
# sampled too, at 19 groups.

# --- The routes, each as the effect that is the route ------------------------

[[effect]]
match = 'name:"Trinket Mage"'
on = "cast"
fetch = ['name:"Lantern of Insight"']
to = "hand"

[[effect]]
match = 'name:"Fabricate"'
on = "cast"
fetch = ['name:"Lantern of Insight"']
to = "hand"

# The −3 read as part of the cast, as the Seeker's −1 is (ADR 0019).
[[effect]]
match = 'name:"Tezzeret, Cruel Captain"'
on = "cast"
fetch = ['name:"Lantern of Insight"']
to = "hand"

[[effect]]
match = 'name:"Whir of Invention"'
on = "cast"
cost = "{1}{U}{U}{U}"
fetch = ['name:"Lantern of Insight"']
to = "battlefield"

[[effect]]
match = 'name:"Tezzeret the Seeker"'
on = "cast"
fetch = ['name:"Lantern of Insight"']
to = "battlefield"

[[effect]]
match = 'name:"Dizzy Spell"'
on = "cast"
cost = "{1}{U}{U}"
fetch = ['name:"Lantern of Insight"']
to = "hand"

[[effect]]
match = "name:\"Urza's Saga\""
on = "landdrop"
after = 2
sacrifice = true
fetch = ['name:"Lantern of Insight"']
to = "battlefield"

[[effect]]
match = 'name:"Expedition Map"'
on = "activate"
cost = "{2}"
sacrifice = true
fetch = ["name:\"Urza's Saga\""]
to = "hand"

# --- The land drop: the Saga, tapped lands, then untapped, most colours first -

[land_drop]
prefer = [
  "name:\"Urza's Saga\"",
  # enter tapped
  'name:"Ketria Triome"',
  'name:"Slagwoods Bridge" or name:"Stomping Ground"',
  'name:"Silverbluff Bridge" or name:"Steam Vents" or name:"Training Center" or name:"Turbulent Springs"',
  'name:"Breeding Pool" or name:"Hedge Maze" or name:"Rejuvenating Springs" or name:"Turbulent Wilderness"',
  'name:"Shatterskull Smashing" or name:"Spikefield Hazard" or name:"Valakut Awakening"',
  'name:"Jwari Disruption" or name:"Sea Gate Restoration" or name:"Silundi Vision"',
  'name:"Bala Ged Recovery" or name:"Shifting Woodland"',
  # makes nothing
  'name:"Maze of Ith"',
  # enter untapped
  'name:"Misty Rainforest" or name:"Prismatic Vista" or name:"Scalding Tarn" or name:"Wooded Foothills"',
  'name:"Volcanic Island"',
  'name:"Tropical Island"',
  'name:"Taiga"',
  't:basic name:"Island" or name:"Otawara, Soaring City" or name:"Seat of the Synod"',
  't:basic name:"Mountain"',
  't:basic name:"Forest" or name:"Boseiju, Who Endures"',
  "name:\"Academy Ruins\" or name:\"Castle Doom\" or name:\"Darksteel Citadel\" or name:\"Inventors' Fair\" or name:\"Spire of Industry\"",
]

# --- The line -----------------------------------------------------------------

[casting]
prefer = [
  'name:"Lantern of Insight"',
  'name:"Sol Ring"',
  'name:"Rashmi and Ragavan"',
  'name:"Whir of Invention"',
  'name:"Tezzeret the Seeker"',
  'name:"Trinket Mage" or name:"Fabricate" or name:"Tezzeret, Cruel Captain"',
  'name:"Dizzy Spell"',
  'name:"Expedition Map"',
  'name:"Arcane Signet"',
  'name:"Talisman of Creativity"',
  'name:"Talisman of Curiosity"',
  'name:"Talisman of Impulse"',
  'name:"Mind Stone"',
]

# --- The north star, one criterion a turn --------------------------------------
# Informational: the owner chooses the bound and its turn from this curve.

[[criterion]]
name = "north star: Lantern of Insight on the battlefield and Rashmi and Ragavan cast, by turn 4"
require = [
  { turn = 4, query = 'name:"Lantern of Insight"', zone = "battlefield", min = 1 },
  { turn = 4, cast = 'name:"Rashmi and Ragavan"', min = 1 },
]

[[criterion]]
name = "north star: Lantern of Insight on the battlefield and Rashmi and Ragavan cast, by turn 5"
require = [
  { turn = 5, query = 'name:"Lantern of Insight"', zone = "battlefield", min = 1 },
  { turn = 5, cast = 'name:"Rashmi and Ragavan"', min = 1 },
]

[[criterion]]
name = "north star: Lantern of Insight on the battlefield and Rashmi and Ragavan cast, by turn 6"
require = [
  { turn = 6, query = 'name:"Lantern of Insight"', zone = "battlefield", min = 1 },
  { turn = 6, cast = 'name:"Rashmi and Ragavan"', min = 1 },
]

[[criterion]]
name = "north star: Lantern of Insight on the battlefield and Rashmi and Ragavan cast, by turn 7"
require = [
  { turn = 7, query = 'name:"Lantern of Insight"', zone = "battlefield", min = 1 },
  { turn = 7, cast = 'name:"Rashmi and Ragavan"', min = 1 },
]

# --- Its halves, on the same line ----------------------------------------------
# Which half binds. Each is the north star's clause on its own, so the north
# star is at most the smaller of them, and the gap between that and the joint
# is the hands that reached one half and not the other.

[[criterion]]
name = "north star, Lantern half: Lantern of Insight on the battlefield by turn 5"
require = [{ turn = 5, query = 'name:"Lantern of Insight"', zone = "battlefield", min = 1 }]

[[criterion]]
name = "north star, commander half: Rashmi and Ragavan cast by turn 5"
require = [{ turn = 5, cast = 'name:"Rashmi and Ragavan"', min = 1 }]

# How much of the Lantern half the line paid {1} for, from hand — drawn, or
# found by a hand tutor. The rest the Saga, Whir or the Seeker put down.
[[criterion]]
name = "north star line: Lantern of Insight hard-cast by turn 5"
require = [{ turn = 5, cast = 'name:"Lantern of Insight"', min = 1 }]
