# "There's No Place Like Loam" — https://archidekt.com/decks/26329102
#
# THE NORTH STAR
# --------------
# Life from the Loam put into the graveyard AND Borborygmos and Fblthp cast,
# by turn 5 — by any line the pilot's own cards allow, on one mana budget,
# with opponents neither helping nor hindering (CONTEXT.md, "North star").
#
# That is one criterion here, two clauses against the same game, and nothing
# else: no proxy for either half. Every route to either half that this engine
# models is an effect the line below fires, so the number is what the pilot's
# own cards do rather than what a stand-in for them does.
#
# It is asked at turns 4 to 7, with each half beside it on the same line and
# the same games, so the curve and what bottlenecks it read off one run.
#
# NO BOUND. The number is informational: which turn to hold the deck to, and
# how often, is the owner's call, made off the curve below rather than written
# here in advance.
#
# THE LINE
# --------
# One [casting] list spends one pool. Read from the top every time a spell
# resolves, it casts the first entry the pool can still pay for:
#
#   1. Borborygmos and Fblthp, from the command zone, {2}{G}{U}{R}.
#   2. Life from the Loam, {1}{G}: a sorcery, so casting it puts it in the
#      graveyard (CR 608.2n).
#   3. Birds of Paradise and Elvish Mystic: mana from the turn after
#      (ADR-0018; a dork is summoning-sick, CR 302.6).
#   4. Frantic Search, free: it untaps the three lands that paid for it.
#   5. Spellseeker, which fetches the Loam to hand.
#   6. Malevolent Rumble and Midnight Tilling: mill four, keep Spellseeker or
#      else a land.
#   7. Izzet Charm and Desperate Ravings: draw two, then discard.
#   8. Aftermath Analyst (mill three) and Wrenn and Seven (+1: reveal four,
#      lands to hand, the rest to the graveyard).
#   9. Six, Icetill Explorer and Lumra, whose mills are an attack's, a
#      landfall's and an enters trigger's.
#
# WHY THIS ORDER. The commander costs five and nothing else in the deck makes
# five before turn 4, so first in the list it costs the line nothing on turns
# 1 to 3 and is never outbid on the turn five mana appears; the Loam is next
# because casting it is the route that needs nothing else. The dorks come
# before the enablers because one mana now is a mana every later turn. Eight
# orders were tried, 1,000,000 hands each (± 0.03 at turn 5, 0.04 at turn 7),
# sampled with the same seed so the differences are sharper than the ± on
# either figure (play / draw):
#
#                                               turn 5          turn 7
#   commander, Loam, dorks, the rest (chosen)   8.22 / 10.64    23.92 / 27.98
#   Loam, commander, dorks, the rest            8.18 / 10.60    23.90 / 27.99
#   Loam, commander, dorks, Seeker, Frantic     8.11 / 10.55    23.89 / 27.91
#   ... and the mills before the rummages       8.13 / 10.58    23.97 / 27.96
#   Loam, commander, Seeker, dorks, Frantic     8.13 / 10.60    23.87 / 27.94
#   commander, dorks, the rest                  8.07 / 10.53    23.83 / 27.86
#   dorks, Loam, commander, the rest            7.93 / 10.22    23.86 / 27.85
#   dorks, the enablers, the commander last     5.74 /  6.98    22.06 / 25.75
#
# All within 0.15 of each other but one: the commander LAST is 2.5 points on
# the play and 3.7 on the draw below the rest at turn 5, because turn 5's
# mana goes on a mill or a rummage and the commander waits a turn. So the
# commander goes early, and among the early orders the chosen one is best at
# turn 5 on both seats and ties at turn 7. (Measured with the land drop and
# the discard list below. With loam-cast's, a first round of the same orders
# was as close, and the commander last as far behind.)
#
# THE LAND DROP
# -------------
# A discard can bin a land, and which lands are still in hand is which ones
# were played, so the discards need the drop declared (ADR-0017 §3). Chosen
# the same way, at turn 5 (play / draw):
#
#   taplands, then any land in decklist order            7.37 /  9.61
#   ... the shocklands and the like after the taplands   7.65 /  9.84
#   ... and the fetchlands next                          7.98 / 10.41
#   shocklands first, taplands, fetchlands, then lands
#     that make none of {G}{U}{R}                        8.03 / 10.41
#   ... then nonbasics, basics last (chosen)             8.11 / 10.55
#   the colourless lands first of all                    7.43 /  9.54
#   basics before the other nonbasics                    7.57 /  9.80
#
# (measured on an earlier order, Loam, commander, dorks, Spellseeker, Frantic
# Search, the rest; the chosen order adds the last 0.1.) The shocklands are
# `otag:conditional-tapland`: Argoth, Breeding Pool, Mystic Sanctuary, Steam
# Vents and Stomping Ground, which the run assumes enter tapped. A land that
# enters tapped costs least early, so those go first; a fetchland is read as
# every colour it can find, so playing it early is playing the best land
# early; the colourless utility lands pay generic and nothing else; and basics
# are the colours held back for the turn a pip needs one.
#
# THE DISCARDS
# ------------
# Frantic Search and Izzet Charm discard two, and Borborygmos may discard any
# number of lands. The [discard] list bins the Loam first, then a nonland card
# this line never casts. It names no land, and that is the choice that
# matters: loam-cast's list binned lands second, which Borborygmos then reads
# as every land in hand, and Frantic Search and Izzet Charm as the next cards
# to go. On the earlier order and the old land drop, at turn 5:
#
#   the Loam, then any land                        7.04 / 9.19
#   the Loam alone, then at random                 7.25 / 9.47
#   the Loam, then a nonland the line never casts  7.37 / 9.61  (chosen)
#   ... and lands third                            7.36 / 9.60
#
# Lands third changes nothing at turn 5, and would have Borborygmos bin every
# land in hand from then on. Desperate Ravings discards at random and ignores the list.
#
# LUMRA'S RETURN IS NOT DECLARED
# ------------------------------
# The standard library's Lumra mills four and then returns every land in the
# graveyard to the battlefield. Declared here without the return: when this was
# written those lands paid for nothing (a turn's bill was held to its drops;
# ADR-0025 has them pay from the next turn, unmeasured here), so their one
# effect was an Icetill landfall each, and with it in the line the run is
# refused at turn 6 and turn 7 on both seats — the bound on what the library
# can lose counts every land in the deck coming back, and a turn-6 run reads
# 12 cards drawn and 91 more that spells could turn over, from 98. At turn 5,
# where it is answered, the north star alone on this line reads 8.33 / 10.56
# with the return and 8.21 / 10.51 without, sampled with the same seed: about
# a tenth of a point on the play, and inside the ± on the draw. A floor, by
# about that much at turn 5 and more later, when Lumra is cast more often.
#
# WHAT IS NOT MODELLED, AND WHICH WAY EACH LEANS
# ----------------------------------------------
# Every item below is a floor — a line the pilot could play that the number
# does not count — unless it says otherwise.
#
#   * DREDGE (ADR-0017). Dredge is a may and the engine never takes it; the
#     run names Life from the Loam and Shenanigans as never dredged. Loam's
#     own Dredge 3 presupposes it is already in the graveyard; Shenanigans'
#     Dredge 1 could mill it there. Floor.
#   * Cycling lands, Tolaria West's transmute, Argoth, Otawara and the other
#     channel lands, Glint-Horn Buccaneer: activated abilities. Floor.
#   * Flashback and retrace (Desperate Ravings, Deep Analysis, Chemister's
#     Insight, the retrace spells): casting from the graveyard. Floor.
#   * Ramp spells (Cultivate, Kodama's Reach, Nature's Lore, Flare of
#     Cultivation), Lotus Cobra's landfall mana, Malevolent Rumble's Spawn,
#     Izzet Boilerworks and Simic Growth Chamber's second mana: not cast or
#     not counted. Floor.
#   * Three Steps Ahead (a Spree cost), Cavalier of Flame (a discard before its
#     draw), Magmatic Insight, Stock Up and the deck's other card draw: not in
#     the line. Floor.
#   * Vastlands Scavenger's Bind to Life: a prepared spell, a second casting
#     the line does not make. Floor.
#   * The land drop is one declared priority, not the best land for each deal;
#     a land drawn mid-line waits for the next drop; Frantic Search untaps the
#     lands that paid for it rather than the best three; Wrenn and Seven
#     activates once; Icetill Explorer's extra land a turn and lands played
#     from the graveyard are not used; Loam returning lands to hand when it
#     resolves is not played. Floor.
#   * Shocklands, Argoth and Mystic Sanctuary enter tapped; Exotic Orchard
#     pays no colour (there is no opponent). Floor.
#   * A fetchland is read as finding a land still in the library, which can
#     run out. The one item that leans UP, and by little.
#   * Six attacks every turn and nobody blocks it: the definition's "opponents
#     neither help nor hinder", stated by the run as ASSUMED.
#   * Lumra's return, above. Floor.
#   * Mulligans: none declared, so every seven is kept. Its sign is the
#     owner's keep rule, not this file's.
#
# WHAT IT READS
# -------------
# Sampled, 200,000 hands a seat; ± is the standard error, 0.08 to 0.11 on
# the halves:
#
#   by turn                       4               5               6               7
#   THE NORTH STAR, play     0.53 ± 0.02     8.22 ± 0.06    17.93 ± 0.09    23.98 ± 0.10
#   THE NORTH STAR, draw     0.80 ± 0.02    10.71 ± 0.07    22.06 ± 0.09    27.93 ± 0.10
#   Loam in the yard, play  14.14           17.44           24.13           28.64
#   Loam in the yard, draw  16.06           19.55           27.02           31.51
#   commander cast, play     7.24           52.11           72.05           80.78
#   commander cast, draw     8.98           59.10           79.14           86.22
#
# The Loam is the bottleneck: the commander is cast by turn 5 in more than
# half of games, the Loam reaches the yard in under one in five. And the two
# halves compete for the same lands: 8.22 is under the 9.09 they would make if
# they were independent. On turn 4 the commander needs a dork cast by turn 3.
#
# Each turn is a class of its own, 44 groups whose width passes the 5,000,000
# ceiling, so every figure is sampled (`jq '.enumerations'`). A run takes
# about three minutes a seat on four cores, most of it counting each class's
# paths against the ceiling before sampling them.
#
# Against the files this replaces: loam-cast's line, with no commander and no
# dorks, put the Loam in the yard by turn 5 on 19.79% / 22.57%; this line,
# which spends turn 5's mana on the commander first, on 17.44% / 19.55%.
# loam-commander's lands-only commander is 51.99% / 62.10% by turn 5, and
# loam-rocks' commander-then-dorks line 56.52% / 66.37%; here the Loam and
# the enablers spend the dorks' early mana, and it is 52.11% / 59.10%.
#
# `checker/` asks the same line from the rules — the commander, the dorks,
# every mill, discard and trigger, this land drop and this list — and holds
# every criterion here against the engine on both seats.
#
# THE FILES BESIDE THIS ONE
# -------------------------
#   * loam-access.criteria.toml: this file's questions until #101 — the Loam
#     Access category, the {1}{G} gate, the drawn-versus-played land counts —
#     which ask no line and would be repriced by this one.
#   * loam-commander.criteria.toml and loam-rocks.criteria.toml: the commander
#     half alone, lands only and with the dorks, the evidence for ADR-0018.
#   * loam-analyst.criteria.toml: one mill dealt last and answered exactly,
#     ADR-0017 §4's case.
#   * loam-thinning.criteria.toml: what the fetchlands' thinning is worth.

[[effect]]
match = 'name:"Spellseeker"'
on = "cast"
fetch = ['name:"Life from the Loam"']
to = "hand"

# The standard library's Rumble, Tilling and Six, written again with the
# choice beside them, because last-wins overrides a whole entry at a time.
[[effect]]
match = 'name:"Malevolent Rumble"'
on = "cast"
mill = 4
keep = 1
keep_only = "is:permanent"
to_hand = ['name:"Spellseeker"', 't:land']

[[effect]]
match = 'name:"Midnight Tilling"'
on = "cast"
mill = 4
keep = 1
keep_only = "is:permanent"
to_hand = ['name:"Spellseeker"', 't:land']

[[effect]]
match = 'name:"Six" t:treefolk'
on = "attack"
mill = 3
keep = 1
keep_only = "t:land"
to_hand = ['t:land']

# Lumra's mill without its return: see the header.
[[effect]]
match = 'name:"Lumra, Bellow of the Woods"'
on = "cast"
mill = 4

[casting]
prefer = [
  'name:"Borborygmos and Fblthp"',
  'name:"Life from the Loam"',
  'name:"Birds of Paradise" or name:"Elvish Mystic"',
  'name:"Frantic Search"',
  'name:"Spellseeker"',
  'name:"Malevolent Rumble"',
  'name:"Midnight Tilling"',
  'name:"Izzet Charm"',
  'name:"Desperate Ravings"',
  'name:"Aftermath Analyst"',
  'name:"Wrenn and Seven"',
  'name:"Six" t:treefolk',
  'name:"Icetill Explorer"',
  'name:"Lumra, Bellow of the Woods"',
]

# The Loam, then a nonland card no entry above casts. No land: see the header.
[discard]
prefer = [
  'name:"Life from the Loam"',
  '''-t:land -name:"Borborygmos and Fblthp" -name:"Life from the Loam" -name:"Birds of Paradise" -name:"Elvish Mystic" -name:"Frantic Search" -name:"Spellseeker" -name:"Malevolent Rumble" -name:"Midnight Tilling" -name:"Izzet Charm" -name:"Desperate Ravings" -name:"Aftermath Analyst" -name:"Wrenn and Seven" -(name:"Six" t:treefolk) -name:"Icetill Explorer" -name:"Lumra, Bellow of the Woods"''',
]

[land_drop]
prefer = [
  "otag:conditional-tapland",
  "otag:tapland",
  "otag:fetchland",
  "t:land -produces:g -produces:u -produces:r",
  "t:land -t:basic",
  "t:land",
]

# --- The north star, turns 4 to 7 -----------------------------------------

[[criterion]]
name = "north star by turn 4: Life from the Loam put into the graveyard and Borborygmos and Fblthp cast"
require = [
  { turn = 4, query = 'name:"Life from the Loam"', zone = "graveyard", min = 1 },
  { turn = 4, cast = 'name:"Borborygmos and Fblthp"', min = 1 },
]

[[criterion]]
name = "north star by turn 5: Life from the Loam put into the graveyard and Borborygmos and Fblthp cast"
require = [
  { turn = 5, query = 'name:"Life from the Loam"', zone = "graveyard", min = 1 },
  { turn = 5, cast = 'name:"Borborygmos and Fblthp"', min = 1 },
]

[[criterion]]
name = "north star by turn 6: Life from the Loam put into the graveyard and Borborygmos and Fblthp cast"
require = [
  { turn = 6, query = 'name:"Life from the Loam"', zone = "graveyard", min = 1 },
  { turn = 6, cast = 'name:"Borborygmos and Fblthp"', min = 1 },
]

[[criterion]]
name = "north star by turn 7: Life from the Loam put into the graveyard and Borborygmos and Fblthp cast"
require = [
  { turn = 7, query = 'name:"Life from the Loam"', zone = "graveyard", min = 1 },
  { turn = 7, cast = 'name:"Borborygmos and Fblthp"', min = 1 },
]

# --- Each half, on the same line ------------------------------------------
# Nothing takes the Loam back out of the graveyard here (dredge is never
# taken), so a count in the graveyard is the arrival the north star asks for.

[[criterion]]
name = "Life from the Loam in the graveyard by turn 4, north-star line"
require = [{ turn = 4, query = 'name:"Life from the Loam"', zone = "graveyard", min = 1 }]

[[criterion]]
name = "Life from the Loam in the graveyard by turn 5, north-star line"
require = [{ turn = 5, query = 'name:"Life from the Loam"', zone = "graveyard", min = 1 }]

[[criterion]]
name = "Life from the Loam in the graveyard by turn 6, north-star line"
require = [{ turn = 6, query = 'name:"Life from the Loam"', zone = "graveyard", min = 1 }]

[[criterion]]
name = "Life from the Loam in the graveyard by turn 7, north-star line"
require = [{ turn = 7, query = 'name:"Life from the Loam"', zone = "graveyard", min = 1 }]

[[criterion]]
name = "Borborygmos and Fblthp cast by turn 4, north-star line"
require = [{ turn = 4, cast = 'name:"Borborygmos and Fblthp"', min = 1 }]

[[criterion]]
name = "Borborygmos and Fblthp cast by turn 5, north-star line"
require = [{ turn = 5, cast = 'name:"Borborygmos and Fblthp"', min = 1 }]

[[criterion]]
name = "Borborygmos and Fblthp cast by turn 6, north-star line"
require = [{ turn = 6, cast = 'name:"Borborygmos and Fblthp"', min = 1 }]

[[criterion]]
name = "Borborygmos and Fblthp cast by turn 7, north-star line"
require = [{ turn = 7, cast = 'name:"Borborygmos and Fblthp"', min = 1 }]
