# "Third Lantern Control" — https://archidekt.com/decks/25088186
# Routes 1 and 3, and Dizzy Spell: the Lantern cast from hand, or tutored for
# by a card the line pays for.
#
# lantern-route-seeker.criteria.toml with Dizzy Spell and Whir of Invention
# added to its line, so the difference between the two files is those two
# cards and nothing else (ADR-0019, second ticket, #97).
#
# WHAT IS MODELLED HERE
# ---------------------
#   [[effect]] — three tutors, each fired when the line plays the card:
#     * Whir of Invention, `{X}{U}{U}{U}` printed, played at X = 1 for
#       {1}{U}{U}{U}: an artifact with mana value 1 or less onto the
#       battlefield. Its {X} is refused unless an effect declares what the
#       pilot pays, and `cost` is that declaration.
#     * Tezzeret the Seeker, {3}{U}{U}, whose −1 puts the Lantern onto the
#       battlefield the turn he is cast (HANDS.md hand 40).
#     * Dizzy Spell's transmute: {1}{U}{U} and discard it, at sorcery speed,
#       for a card with its mana value, 1 — the Lantern, to hand. Its printed
#       {U} is a spell that does nothing for this deck, and billed at {U} the
#       transmute would be a turn-1 tutor (HANDS.md hand 41). A `cast` clause
#       counts the transmutation as Dizzy Spell played.
#   [casting]  — the Lantern first, cast for {1} whenever it is in hand; then
#                the cheapest tutor that lands it outright, Whir; then the
#                Seeker; then Dizzy Spell, whose Lantern still costs {1}.
#
# WHAT DIZZY SPELL AND WHIR ARE WORTH, MEASURED
# ---------------------------------------------
# Against lantern-route-seeker.criteria.toml, which is this line without them,
# on the committed index:
#
#                                             play               draw
#                                      seeker   + both    seeker   + both
#   Lantern on the battlefield by t5   13.76%   21.75%    16.03%   25.87%
#   Lantern of Insight cast by t5      11.10%   16.60%    12.14%   18.86%
#   Whir of Invention cast by t5          —      3.20%       —      4.38%
#   Dizzy Spell transmuted by t5          —      6.64%       —      8.14%
#
# Sampled, ± 0.04 to 0.10: 11 groups and 284,738,168 compositions at turn 5
# on the play, in about 1.2s a seat. The route question moves +8.0 points on
# the play and +9.8 on the draw. ADR-0019 estimated +5.35 and +6.38 for the
# two together, added after Trinket Mage, Fabricate, Cruel Captain and the
# Saga were already in the line; here the only other routes are the Lantern
# drawn and the Seeker, so there is less for Dizzy Spell and Whir to overlap
# with. Dizzy Spell is transmuted by turn 2 on no deal at all (exact): its
# {U} is never what the line pays.
#
# STILL NOT MODELLED
# ------------------
#   * Improvise. Whir pays its four in full, which the run says; with rocks
#     and artifact lands tapped for it, it would come a turn sooner. A floor.
#   * A larger X. At X = 1 Whir finds nothing but the Lantern's mana value,
#     which is all this route wants.
#   * Rocks. The line pays off lands alone, so this is a floor.
#   * Mulligans. Turn 0 is a kept seven.

[[effect]]
match = 'name:"Whir of Invention"'
on = "cast"
cost = "{1}{U}{U}{U}"
fetch = ['name:"Lantern of Insight"']
to = "battlefield"

[[effect]]
match = 'name:"Tezzeret the Seeker"'
on = "cast"
fetch = ['name:"Lantern of Insight"']
to = "battlefield"

[[effect]]
match = 'name:"Dizzy Spell"'
on = "cast"
cost = "{1}{U}{U}"
fetch = ['name:"Lantern of Insight"']
to = "hand"

[casting]
prefer = [
  'name:"Lantern of Insight"',
  'name:"Whir of Invention"',
  'name:"Tezzeret the Seeker"',
  'name:"Dizzy Spell"',
]

# THRESHOLD: none, for the reason route B's file gives. Three routes of four.

[[criterion]]
name = "Whir of Invention cast by turn 5"
require = [{ turn = 5, cast = 'name:"Whir of Invention"', min = 1 }]

[[criterion]]
name = "Dizzy Spell transmuted by turn 5"
require = [{ turn = 5, cast = 'name:"Dizzy Spell"', min = 1 }]

[[criterion]]
name = "Lantern of Insight cast by turn 5"
require = [{ turn = 5, cast = 'name:"Lantern of Insight"', min = 1 }]

# Where the route ends: the Lantern in play, whether the line cast it or a
# tutor put it there.
[[criterion]]
name = "Lantern of Insight on the battlefield by turn 5, cast or put there by a tutor"
require = [{ turn = 5, query = 'name:"Lantern of Insight"', zone = "battlefield", min = 1 }]

[[expect]]
name = "Lanterns still in the library on turn 5"
turn = 5
query = 'name:"Lantern of Insight"'
zone = "library"
